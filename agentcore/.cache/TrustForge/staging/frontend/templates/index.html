<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustForge Hermes — 信任提煉分析</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', -apple-system, sans-serif; background: #0d1117; min-height: 100vh; display: flex; flex-direction: column; color: #c9d1d9; }
.container { max-width: 860px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; display: flex; flex-direction: column; }
.header { text-align: center; padding: 40px 0 20px; }
.header h1 { font-size: 24px; color: #f0f6fc; }
.header h1 span { color: #f7931a; }
.status { text-align: center; font-size: 11px; color: #484f58; padding: 6px 0; }
.status .live { color: #7ee787; }
.status .btn-new { padding: 3px 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; font-size: 10px; cursor: pointer; color: #8b949e; margin-left: 6px; text-decoration: none; }
.status .btn-new:hover { border-color: #f7931a; color: #f7931a; }
.chat-area { flex: 1; overflow-y: auto; padding: 16px 0; }
.message { margin-bottom: 14px; display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message.user { justify-content: flex-end; }
.message .bubble { max-width: 78%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
.message.user .bubble { background: #f7931a; color: #0d1117; border-bottom-right-radius: 3px; font-weight: 500; }
.message.assistant .bubble { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; border-bottom-left-radius: 3px; }
.message.assistant .avatar { width: 28px; height: 28px; background: linear-gradient(135deg, #f7931a, #f59e0b); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.thinking { display: flex; gap: 4px; padding: 4px 0; }
.thinking span { width: 7px; height: 7px; background: #f7931a; border-radius: 50%; animation: bounce 1.4s infinite; }
.thinking span:nth-child(2) { animation-delay: 0.2s; }
.thinking span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0.5); } 40% { transform: scale(1); } }
.input-area { padding: 16px 0; position: sticky; bottom: 0; }
.input-bar { display: flex; align-items: center; background: #161b22; border-radius: 12px; padding: 6px 6px 6px 16px; border: 1px solid #30363d; }
.input-bar:focus-within { border-color: #f7931a; }
.input-bar input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; color: #f0f6fc; font-family: inherit; }
.input-bar input::placeholder { color: #484f58; }
.input-bar button { width: 36px; height: 36px; border-radius: 8px; border: none; background: #f7931a; color: #0d1117; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s; }
.input-bar button:hover { background: #f59e0b; }
.input-bar button:disabled { background: #30363d; color: #484f58; cursor: default; }
.quick-actions { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.quick-actions button { padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #8b949e; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.quick-actions button:hover { border-color: #f7931a; color: #f7931a; }
</style>
</head>
<body>
<div class="container">
  <div class="status">
    <span class="live">● Live</span> — {{ runtime_arn[:60] }}...
    <button class="btn-new" onclick="newSession()">🔄 New</button>
    <a href="/logout" class="btn-new">🚪 {{ username }}</a>
    <span id="sessionLabel"></span>
  </div>
  <div class="header" id="header">
    <h1>🔥 <span>TrustForge</span> Hermes</h1>
    <p style="color:#8b949e;font-size:12px;margin-top:8px">多源資訊的信任提煉 — 問我任何加密市場問題</p>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="input-area">
    <div class="input-bar">
      <input id="msgInput" type="text" placeholder="分析 BTC 近期走勢..." onkeydown="if(event.key==='Enter')sendMsg()" autofocus />
      <button onclick="sendMsg()" id="sendBtn">↑</button>
    </div>
    <div class="quick-actions" id="quickActions">
      <button onclick="quickSend('分析 BTC 目前市場多空情緒')">₿ BTC 多空</button>
      <button onclick="quickSend('ETH 近期有什麼重要消息？信任度如何？')">Ξ ETH 新聞</button>
      <button onclick="quickSend('比較 SOL 和 ADA 的鏈上活躍度')">⚡ SOL vs ADA</button>
      <button onclick="quickSend('目前支援哪些幣種？')">📋 幣種清單</button>
      <button onclick="quickSend('DOGE 社群情緒分析，標注可信度')">🐕 DOGE 情緒</button>
    </div>
  </div>
</div>
<script>
let sessionId = crypto.randomUUID();
document.getElementById('sessionLabel').textContent = '  Session: ' + sessionId.slice(0,8);

function newSession() {
  sessionId = crypto.randomUUID();
  document.getElementById('sessionLabel').textContent = '  Session: ' + sessionId.slice(0,8);
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('quickActions').style.display = 'flex';
  document.getElementById('header').style.display = 'block';
}

function addMessage(role, text) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  if (role === 'assistant') {
    div.innerHTML = '<div class="avatar">🔥</div><div class="bubble">' + text.replace(/\n/g, '<br>') + '</div>';
  } else {
    div.innerHTML = '<div class="bubble">' + text + '</div>';
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showThinking() {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message assistant'; div.id = 'thinking';
  div.innerHTML = '<div class="avatar">🔥</div><div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeThinking() { const el = document.getElementById('thinking'); if (el) el.remove(); }

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  document.getElementById('quickActions').style.display = 'none';
  document.getElementById('header').style.display = 'none';
  addMessage('user', msg);
  showThinking();
  document.getElementById('sendBtn').disabled = true;
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: msg, session_id: sessionId})
    });
    const data = await resp.json();
    removeThinking();
    addMessage('assistant', data.response || data.error || 'No response');
  } catch(e) {
    removeThinking();
    addMessage('assistant', '❌ Error: ' + e.message);
  }
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function quickSend(text) { document.getElementById('msgInput').value = text; sendMsg(); }
</script>
</body>
</html>

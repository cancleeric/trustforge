<!DOCTYPE html> <html> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <script src="./support.js"></script> </head> <body> <x-dc> <helmet> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet"> <style> * { box-sizing: border-box; } :root{ --bg:#050810; --bg-hero:#0a1420; --panel:#0a1018; --card:#0d141e; --well:#070c14; --border:#1c2b3a; --border-hi:#28405a; --bg-hover-alt:#111a26; --text:#dce9f2; --muted:#7f97ab; --label:#526375; --cyan:#4dd8e0; --gold:#e8b34d; --red:#ff5f5f; --green:#46c98b; } .hrm-term { position: relative; border-bottom: 1px dotted #4dd8e0; cursor: help; } .hrm-tip { position: absolute; left: 0; bottom: calc(100% + 9px); width: 244px; max-width: 78vw; background: #0d141e; border: 1px solid #28405a; border-radius: 8px; padding: 11px 13px; font-size: 11px; line-height: 1.55; color: #a9bccd; letter-spacing: 0; text-transform: none; font-weight: 400; box-shadow: 0 14px 34px rgba(0,0,0,0.55); opacity: 0; visibility: hidden; transform: translateY(5px); transition: opacity .16s ease, transform .16s ease; z-index: 400; pointer-events: none; white-space: normal; } .hrm-tip::after { content: ''; position: absolute; top: 100%; left: 18px; border: 6px solid transparent; border-top-color: #28405a; } .hrm-term:hover .hrm-tip { opacity: 1; visibility: visible; transform: translateY(0); } body { margin: 0; background: #050810; } a { color: #4dd8e0; text-decoration: none; } a:hover { color: #7fe9ef; } @keyframes hrmBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } } @keyframes hrmGlitch { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-2px,1px); } 40% { transform: translate(2px,-1px); } 60% { transform: translate(-1px,0); } 80% { transform: translate(1px,1px); } } @keyframes hrmPulseRed { 0%,100% { box-shadow: 0 0 0 0 rgba(255,95,95,0.5), 0 0 14px 2px rgba(255,95,95,0.4); } 50% { box-shadow: 0 0 0 7px rgba(255,95,95,0), 0 0 24px 5px rgba(255,95,95,0.65); } } @keyframes hrmCountdown { from { width: 100%; } to { width: 0%; } } </style> </helmet> <div style="min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace;"> <!-- TOP CHROME BAR --> <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 22px; background: var(--panel); border-bottom: 1px solid var(--border);"> <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: 0.14em;"> <span style="color: var(--cyan); font-size: 16px;">◇</span> <span style="color: var(--text);">TRUSTFORGE</span><span style="color: var(--muted);">HERMES</span> </div> <div style="display: flex; align-items: center; gap: 26px; font-size: 12.5px; letter-spacing: 0.06em; color: var(--muted);"> <span>分析</span><span>比較</span><span>歷史趨勢</span><span>來源狀態</span><span>成本</span> </div> <div style="display: flex; align-items: center; gap: 16px; font-size: 11.5px; letter-spacing: 0.08em; color: var(--label);"> <span>v0.16.1</span><span style="color: var(--muted);">EN</span> <a href="./HERMES Help Center.dc.html" style="color: var(--label);">? 說明</a> <span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 10px; height: 10px; border-radius: 50%; border: 1px solid #28405a; background: linear-gradient(135deg,var(--text) 50%,var(--panel) 50%);"></span>theme</span> </div> </div> <!-- SUB-HEADER STRIP --> <div style="display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 22px; background: var(--well); border-bottom: 1px solid var(--border); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;"> <div style="color: var(--muted); display: flex; align-items: center; gap: 10px;"><span style="color: var(--red);">FAULT CHANNEL</span><span style="color: var(--label);">·</span><span style="color: var(--label);">訊號遺失</span></div> <div style="color: var(--muted); display: flex; align-items: center; gap: 10px;"><span style="color: var(--label);">HOLOGRAPHIC DISPLAY</span><span style="color: var(--label);">·</span><span style="color: var(--red); display:inline-flex; align-items:center; gap:6px;"><span style="width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:hrmBlink 1.2s infinite;"></span>LINK LOST</span></div> </div> <!-- VIEW TABS --> <div style="display: flex; align-items: center; gap: 8px; padding: 14px 22px 0 22px;"> <button onClick="{{ set404 }}" style="{{ tab404Style }}" style-hover="border-color:#28405a;color:var(--text);">404 找不到</button> <button onClick="{{ set500 }}" style="{{ tab500Style }}" style-hover="border-color:#28405a;color:var(--text);">SYSTEM ERROR</button> </div> <!-- BODY WITH RAILS --> <div style="display: grid; grid-template-columns: 34px 1fr 34px; gap: 0; padding: 14px 12px;"> <!-- LEFT RAIL --> <div style="display: flex; align-items: center; justify-content: center;"> <div style="writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; letter-spacing: 0.34em; color: var(--label); text-transform: uppercase; white-space: nowrap;">SYSTEM BUS / ERR-XX</div> </div> <!-- MAIN PANEL --> <div style="position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: inset 0 0 60px rgba(77,216,224,0.04), 0 20px 50px rgba(0,0,0,0.4); overflow: hidden; min-height: 620px;"> <div style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(77,216,224,0.012) 3px, rgba(77,216,224,0.012) 4px);"></div> <!-- static star dots (inline, lightweight) --> <svg viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"> <sc-for list="{{ stars }}" as="st" hint-placeholder-count="34"> <circle cx="{{ st.x }}" cy="{{ st.y }}" r="{{ st.r }}" style="fill:{{ st.fill }};"></circle> </sc-for> <circle cx="600" cy="300" r="230" style="fill:none; stroke:{{ ringColor }}; stroke-width:1;"></circle> <circle cx="600" cy="300" r="150" style="fill:none; stroke:{{ ringColor }}; stroke-width:1;"></circle> </svg> <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 620px; padding: 40px 20px; text-align: center;"> <!-- EYEBROW --> <div style="font-size: 11px; letter-spacing: 0.24em; color: {{ accent }}; text-transform: uppercase; margin-bottom: 22px; display:inline-flex; align-items:center; gap:9px;"><span style="width:6px;height:6px;border-radius:50%;background:{{ accent }};box-shadow:0 0 8px {{ accent }};animation:hrmBlink 1.4s infinite;"></span>{{ eyebrow }}</div> <!-- BIG GLITCH CODE --> <div style="position: relative; margin-bottom: 24px;"> <div style="position: absolute; inset: 0; font-size: 130px; font-weight: 700; line-height: 1; color: rgba(255,95,95,0.35); transform: translate(3px,0); letter-spacing: 0.04em;">{{ code }}</div> <div style="position: absolute; inset: 0; font-size: 130px; font-weight: 700; line-height: 1; color: rgba(77,216,224,0.25); transform: translate(-3px,0); letter-spacing: 0.04em;">{{ code }}</div> <div style="position: relative; font-size: 130px; font-weight: 700; line-height: 1; color: {{ accent }}; letter-spacing: 0.04em; animation: hrmGlitch 3.2s steps(2) infinite; text-shadow: 0 0 30px {{ accentGlow }};">{{ code }}</div> </div> <!-- HEADLINE --> <div style="font-size: 26px; font-weight: 600; color: var(--text); margin-bottom: 12px;">{{ headline }}</div> <div style="font-size: 13.5px; color: var(--muted); line-height: 1.7; max-width: 420px; margin-bottom: 32px;">{{ sub }}</div> <!-- SEVERED PROBE / PIPELINE MOTIF --> <div style="display: flex; align-items: center; gap: 0; margin-bottom: 34px;"> <sc-for list="{{ probeNodes }}" as="n" hint-placeholder-count="4"> <div style="display: flex; align-items: center;"> <div style="width: 22px; height: 22px; transform: rotate(45deg); background: {{ n.bg }}; border: 1.5px solid {{ n.border }}; box-shadow: {{ n.glow }}; animation: {{ n.anim }};"></div> <sc-if value="{{ n.hasConnector }}" hint-placeholder-val="{{ true }}"> <div style="width: 54px; height: 0; border-top: 2px {{ n.connectorStyle }} {{ n.connectorColor }};"></div> </sc-if> </div> </sc-for> <div style="font-size: 11px; color: var(--label); letter-spacing: 0.14em; margin-left: 8px;">{{ probeLabel }}</div> </div> <!-- ACTIONS --> <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 26px;"> <button style="padding: 12px 26px; background: linear-gradient(135deg,{{ btnA }},{{ btnB }}); color: var(--bg); border: none; border-radius: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; box-shadow: 0 0 20px {{ accentGlow }};" style-hover="filter:brightness(1.1);">{{ primaryLabel }}</button> <button style="padding: 12px 22px; background: transparent; border: 1px solid #28405a; border-radius: 9px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.06em; cursor: pointer;" style-hover="border-color:#3a5570;color:var(--text);">{{ ghostLabel }}</button> </div> <!-- TELEMETRY READOUT --> <div style="background: var(--well); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; min-width: 320px;"> <div style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 11.5px; color: var(--label); letter-spacing: 0.06em;"> <span style="color:{{ accent }};">◈</span><span>{{ telemetry }}</span> </div> <sc-if value="{{ showCountdown }}" hint-placeholder-val="{{ false }}"> <div style="margin-top: 10px; height: 3px; border-radius: 2px; background: #12202e; overflow: hidden;"> <div style="height: 100%; background: var(--red); box-shadow: 0 0 8px rgba(255,95,95,0.5); animation: hrmCountdown 5s linear infinite;"></div> </div> </sc-if> </div> </div> </div> <!-- RIGHT RAIL --> <div style="display: flex; align-items: center; justify-content: center;"> <div style="writing-mode: vertical-rl; font-size: 10px; letter-spacing: 0.34em; color: var(--label); text-transform: uppercase; white-space: nowrap;">TELEMETRY / LINK LOST</div> </div> </div> </div> </x-dc> <script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:820}}"> class Component extends DCLogic { state = { view: '404' }; tabStyle(active) { return `padding:7px 18px;background:${active ? 'rgba(77,216,224,0.1)' : '#0a1018'};border:1px solid ${active ? '#4dd8e0' : '#1c2b3a'};border-radius:7px;color:${active ? '#4dd8e0' : '#7f97ab'};font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;cursor:pointer;`; } renderVals() { const v = this.state.view; const is404 = v === '404'; const stars = Array.from({ length: 34 }, () => { const r = (0.6 + Math.random() * 1.8); return { x: (Math.random() * 1200).toFixed(0), y: (Math.random() * 620).toFixed(0), r: r.toFixed(1), fill: `rgba(77,216,224,${(0.12 + Math.random() * 0.35).toFixed(2)})` }; }); // severed probe nodes: last connector broken const litCyan = { bg: 'rgba(77,216,224,0.15)', border: '#4dd8e0', glow: '0 0 10px rgba(77,216,224,0.5)', anim: 'none', hasConnector: true, connectorStyle: 'solid', connectorColor: '#4dd8e0' }; const dead = { bg: 'transparent', border: '#28405a', glow: 'none', anim: 'none', hasConnector: true, connectorStyle: 'dashed', connectorColor: '#1c2b3a' }; const probe404 = [ { ...litCyan }, { ...litCyan, connectorStyle: 'dashed', connectorColor: 'rgba(77,216,224,0.4)' }, { ...dead, bg: 'transparent', border: '#28405a' }, { ...dead, border: '#28405a', hasConnector: false } ]; const litRed = { bg: 'rgba(255,95,95,0.15)', border: '#ff5f5f', glow: '0 0 10px rgba(255,95,95,0.5)', anim: 'none', hasConnector: true, connectorStyle: 'solid', connectorColor: 'rgba(255,95,95,0.6)' }; const probe500 = [ { bg: 'rgba(77,216,224,0.12)', border: '#4dd8e0', glow: '0 0 10px rgba(77,216,224,0.4)', anim: 'none', hasConnector: true, connectorStyle: 'solid', connectorColor: '#4dd8e0' }, { bg: 'rgba(232,179,77,0.15)', border: '#e8b34d', glow: '0 0 10px rgba(232,179,77,0.4)', anim: 'none', hasConnector: true, connectorStyle: 'dashed', connectorColor: 'rgba(232,179,77,0.5)' }, { ...litRed, anim: 'hrmPulseRed 1.6s ease-in-out infinite', connectorStyle: 'dashed', connectorColor: '#3a2530' }, { bg: 'transparent', border: '#3a2530', glow: 'none', anim: 'none', hasConnector: false } ]; if (is404) { return { view: v, set404: () => this.setState({ view: '404' }), set500: () => this.setState({ view: '500' }), tab404Style: this.tabStyle(true), tab500Style: this.tabStyle(false), accent: '#4dd8e0', accentGlow: 'rgba(77,216,224,0.4)', ringColor: 'rgba(77,216,224,0.1)', eyebrow: 'SIGNAL LOST · 訊號遺失', code: '404', headline: '這個座標沒有訊號', sub: '你要找的頁面不在 HERMES 的航圖上。', probeNodes: probe404, probeLabel: 'PROBE DRIFTING · 訊號中斷', btnA: '#4dd8e0', btnB: '#3bc0c8', primaryLabel: '返回艦橋 →', ghostLabel: '重新分析', telemetry: 'last-known route: /unknown · code 404', showCountdown: false, stars }; } return { view: v, set404: () => this.setState({ view: '404' }), set500: () => this.setState({ view: '500' }), tab404Style: this.tabStyle(false), tab500Style: this.tabStyle(true), accent: '#ff5f5f', accentGlow: 'rgba(255,95,95,0.4)', ringColor: 'rgba(255,95,95,0.08)', eyebrow: 'LINK DISRUPTED · 連線中斷', code: '500', headline: 'HERMES 引擎暫時失聯', sub: '跨源連線出現異常，稍後重試或檢查來源狀態。', probeNodes: probe500, probeLabel: 'ENGINE SEVERED · 引擎失聯', btnA: '#e8b34d', btnB: '#f0c877', primaryLabel: '重試 ↻', ghostLabel: '查看來源狀態', telemetry: 'engine: unreachable · retry in 5s', showCountdown: true, stars }; } } </script> </body> </html>

<!DOCTYPE html> <html> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <script src="./support.js"></script> </head> <body> <x-dc> <helmet> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet"> <style> * { box-sizing: border-box; } :root{ --bg:#050810; --bg-hero:#0a1420; --panel:#0a1018; --card:#0d141e; --well:#070c14; --border:#1c2b3a; --border-hi:#28405a; --bg-hover-alt:#111a26; --text:#dce9f2; --muted:#7f97ab; --label:#526375; --cyan:#4dd8e0; --gold:#e8b34d; --red:#ff5f5f; --green:#46c98b; } .hrm-term { position: relative; border-bottom: 1px dotted #4dd8e0; cursor: help; } .hrm-tip { position: absolute; left: 0; bottom: calc(100% + 9px); width: 244px; max-width: 78vw; background: #0d141e; border: 1px solid #28405a; border-radius: 8px; padding: 11px 13px; font-size: 11px; line-height: 1.55; color: #a9bccd; letter-spacing: 0; text-transform: none; font-weight: 400; box-shadow: 0 14px 34px rgba(0,0,0,0.55); opacity: 0; visibility: hidden; transform: translateY(5px); transition: opacity .16s ease, transform .16s ease; z-index: 400; pointer-events: none; white-space: normal; } .hrm-tip::after { content: ''; position: absolute; top: 100%; left: 18px; border: 6px solid transparent; border-top-color: #28405a; } .hrm-term:hover .hrm-tip { opacity: 1; visibility: visible; transform: translateY(0); } body { margin: 0; background: #050810; } ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #070c14; } ::-webkit-scrollbar-thumb { background: #1c2b3a; border-radius: 4px; } a { color: #4dd8e0; text-decoration: none; } a:hover { color: #7fe9ef; } @keyframes hrmBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } } @keyframes hrmSlideDown { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } } @keyframes hrmSlideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } } @keyframes hrmToastBar { from { width: 100%; } to { width: 0%; } } </style> </helmet> <div style="position: relative; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace;"> <!-- ============ BEHIND PAGE (flat, non-filtered, lower opacity) ============ --> <div style="position: absolute; inset: 0; z-index: 0;"> <!-- TOP CHROME BAR (bell lives here, full opacity) --> <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 22px; background: var(--panel); border-bottom: 1px solid var(--border);"> <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: 0.14em;"><span style="color: var(--cyan); font-size: 16px;">◇</span><span style="color: var(--text);">TRUSTFORGE</span><span style="color: var(--muted);">HERMES</span></div> <div style="display: flex; align-items: center; gap: 26px; font-size: 12.5px; color: var(--muted);"><span style="color:var(--text);">分析</span><span>比較</span><span>歷史趨勢</span><span>來源狀態</span><span>成本</span></div> <div style="display: flex; align-items: center; gap: 18px; font-size: 11.5px; color: var(--label);"> <div style="position: relative; width: 28px; height: 28px; border: 1px solid var(--cyan); border-radius: 7px; display:flex; align-items:center; justify-content:center; color:var(--cyan); font-size:14px; background: rgba(77,216,224,0.08);"> <span>◔</span> <span style="position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: var(--bg); font-size: 9px; font-weight: 700; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 8px rgba(255,95,95,0.6);">4</span> </div> <span>v0.16.1</span><span style="color: var(--muted);">EN</span> <a hr :12px; left:12px; width:14px; height:14px; border-top:1px solid var(--cyan); border-left:1px solid var(--cyan); pointer-events:none;"></div> <div style="position:absolute; bottom:12px; right:12px; width:14px; height:14px; border-bottom:1px solid var(--cyan); border-right:1px solid var(--cyan); pointer-events:none;"></div> <!-- HEADER --> <div style="padding: 18px 20px 14px; border-bottom: 1px solid var(--border);"> <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;"> <div style="font-size: 11px; letter-spacing: 0.18em; color: var(--cyan); text-transform: uppercase; display:inline-flex; align-items:center; gap:8px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:hrmBlink 1.6s infinite;"></span>通知中心 · CONTINUOUS ENGINE</div> <span style="font-size: 10.5px; color: var(--muted); cursor: pointer;" style-hover="color:var(--cyan);">全部標記已讀</span> </div> <div style="display: flex; gap: 8px;"> <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3"> <span style="padding: 5px 14px; border-radius: 6px; font-size: 11px; color: {{ f.color }}; background: {{ f.bg }}; border: 1px solid {{ f.border }}; cursor: pointer;" style-hover="border-color:#28405a;">{{ f.label }}</span> </sc-for> </div> </div> <!-- FEED --> <div style="max-height: 440px; overflow-y: auto;"> <sc-for list="{{ notifs }}" as="n" hint-placeholder-count="6"> <div style="display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #12202e; border-left: 3px solid {{ n.accent }}; background: {{ n.rowBg }};" style-hover="background:var(--bg-hover-alt);"> <span style="width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; background: {{ n.iconBg }}; border: 1px solid {{ n.iconBorder }}; display:flex; align-items:center; justify-content:center; color: {{ n.accent }}; font-size: 12px;">{{ n.icon }}</span> <div style="flex: 1; min-width: 0;"> <div style="display: flex; align-items:  style="width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; background: {{ t.iconBg }}; border: 1px solid {{ t.border }}; display:flex; align-items:center; justify-content:center; color: {{ t.accent }}; font-size: 13px;">{{ t.icon }}</span> <div style="flex: 1; min-width: 0;"> <div style="font-size: 10px; letter-spacing: 0.14em; color: {{ t.accent }}; text-transform: uppercase; margin-bottom: 5px;">{{ t.kind }}</div> <div style="font-size: 12.5px; color: var(--text); line-height: 1.45;">{{ t.message }}</div> </div> <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;"> <sc-if value="{{ t.hasAction }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: {{ t.accent }}; cursor: pointer; padding: 3px 10px; border: 1px solid {{ t.border }}; border-radius: 5px;" style-hover="filter:brightness(1.2);">查看</span></sc-if> <span style="font-size: 12px; color: var(--label); cursor: pointer;" style-hover="color:var(--text);">✕</span> </div> </div> <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: #12202e;"><div style="height: 100%; background: {{ t.accent }}; box-shadow: 0 0 6px {{ t.glow }}; animation: hrmToastBar {{ t.dur }} linear infinite;"></div></div> </div> </sc-for> </div> </div> </x-dc> <script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:760}}"> class Component extends DCLogic { renderVals() { const filters = [ { label: '全部', color: '#4dd8e0', bg: 'rgba(77,216,224,0.1)', border: '#4dd8e0' }, { label: '告警', color: '#7f97ab', bg: '#070c14', border: '#1c2b3a' }, { label: '系統', color: '#7f97ab', bg: '#070c14', border: '#1c2b3a' } ]; const sev = { red: { accent: '#ff5f5f', iconBg: 'rgba(255,95,95,0.12)', iconBorder: 'rgba(255,95,95,0.4)', rowBg: 'rgba(255,95,95,0.04)' }, gold: { accent: '#e8b34d', iconBg: 'rgba(232,179,77,0.12)', iconBorder: 'rgba(232,179,77,0.4)', rowBg: 'rgba(232,179,77,0.03)' }, green: { accent: '#46c98b'

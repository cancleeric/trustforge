  /api/analyze:
    get:
      tags: [analysis]
      operationId: getAnalyze
      summary: 核心多源分析（`/analyze.json` 既有輸出的擴充版，統一信封）
      description: |
        完全重用既有 `_do_analyze`/`_do_comparison`（含其內建限流與驗證），
        不重寫分析邏輯，額外補上：雷達（`trust_radar`）／trust_components
        聚合（`trust_components_aggregate`）／price_provenance——三者輸入
        都已在既有 `evidence` 陣列裡，純渲染層再彙總一次，不多打任何連接器/
        Bedrock 呼叫。

        **In-flight dedup（single-flight coalescing）**：同一組
        `(type, coin[,coin2], q, live/real/token)` 參數短時間內的並行/連續
        重複請求，只會有一個 leader 真的呼叫底層 pipeline，其餘等待共用同
        一份真實結果——但**不含**任何 post-completion 結果快取，緊接著的
        下一次請求仍會拿到最新資料，不會 replay 過時分析結果。

        **三檔模式**（`data_mode`/`llm_mode` 解耦）：
        1. 真資料·$0（**預設**，未帶任何 mode 參數即生效）：真連接器抓真
           資料，Bedrock 關閉，$0，60 秒視窗每 IP 最多 60 次。
        2. 離線示範沙盒（`?sample=1`，opt-in）：樣本資料 + Bedrock stub，
           $0，未設 AWS 也能跑。
        3. 真 Bedrock（`?live=1`，須以 `X-Live-Token` header 帶入 token；
           query `?token=` 已移除，不再支援）：需伺服器已設
           `TRUSTFORGE_LIVE_TOKEN` 且 token 比對正確（`hmac.compare_digest`），
           60 秒視窗每 IP 最多 5 次緊門檻。`live` 優先於其餘檔位。
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [multi_source, hypothesis, comparison]
            default: multi_source
        - name: coin
          in: query
          required: false
          description: |
            單幣題型：幣種代碼（預設 `BTC`，須在官方幣種池）。比較題型：可用
            `coin=A,B` 一次帶兩個幣，或搭配 `coin2` 分開帶。
          schema:
            type: string
            default: BTC
        - name: coin2
          in: query
          required: false
          description: 比較分析的第二個幣種（`type=comparison` 時使用，須與 `coin` 不同）
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: 分析問題，最多 1000 字元；未帶時使用內建 date-agnostic 預設問句
          schema:
            type: string
            maxLength: 1000
        - name: sample
          in: query
          required: false
          description: "`1` 進入離線示範沙盒（見上方三檔模式說明）"
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
        - name: live
          in: query
          required: false
          description: "`1` 搭配有效 token 進入真 Bedrock 模式"
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
      responses:
        "200":
          description: |
            單幣題型（`multi_source`/`hypothesis`）回 `AnalyzeSingleData`；
            `type=comparison` 回 `AnalyzeComparisonData`（欄位皆帶 `_a`/`_b`
            後綴，`execution_log` 除外，兩幣共用同一份 log）。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkEnvelope"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AnalyzeSingleData"
                  - allOf:
                      - $ref: "#/components/schemas/OkEnvelope"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AnalyzeComparisonData"
        "400":
          description: |
            請求驗證失敗（純參數驗證，零依賴/連接器呼叫之前即擋下）：`type`
            非法字面值／`q` 超過 1000 字元／`coin` 不在官方幣種池／比較題型
            未選滿兩個不同的幣種。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
              example:
                ok: false
                error:
                  code: bad_request
                  message: "問題長度不能超過 1000 字元（目前 1001 字元）"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |
            In-flight dedup follower 等待逾時（`_AnalyzeDedupTimeout`）——
            leader 尚未算完，可重試，交給呼叫端自行重送，**不會**退化成自己
            真的重跑一次分析。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
              example:
                ok: false
                error:
                  code: timeout
                  message: "分析仍在處理中，請稍後重試"
        "502":
          description: |
            內部連接器/Bedrock/pipeline 依賴失敗（統一收斂，不再按例外型別
            分流成 400——上游/依賴失敗不是使用者輸入錯誤）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
              example:
                ok: false
                error:
                  code: upstream_error
                  message: "分析服務暫時無法使用，請稍後再試"

  /api/operations-status:
    get:
      tags: [operations]
      operationId: getOperationsStatus
      summary: Operations plane 合併觀測端點（schema/auth_audit/quality_gate）
      description: |
        暴露三個面向：
        1. schema (#277)：SQLite schema 版本、table 列表、相容性狀態。
        2. auth_audit (#276)：admin token 是否已設、live token 是否已設、
           trust proxy 狀態、bind host——**只暴露 boolean，絕不暴露 token 值**。
        3. quality_gate (#270)：最新 question-bank-latest.json 評測結果摘要。
      responses:
        "200":
          description: Operations 狀態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
              example:
                ok: true
                data:
                  schema:
                    sqlite_path: "out/trustforge.sqlite3"
                    tables: ["analysis_snapshots", "analysis_jobs", "analysis_results"]
                    table_count: 3
                    user_version: 0
                    status: "ok"
                  auth_audit:
                    admin_token_set: true
                    live_token_set: false
                    trust_proxy: false
                    bind_host: "0.0.0.0"
                  quality_gate:
                    status: "no_data"
                    source: "out/question-bank-latest.json"

  /api/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenApiSpec
      summary: 本文件本身（純 stdlib 讀檔回傳，永遠反映當下部署的 repo 內容）
      description: |
        不設限流（零依賴讀檔，比照 `/api/health`），不套用 `{ok,data,error}`
        信封——成功回應直接是這份 YAML 文件本身。
      responses:
        "200":
          description: OpenAPI 3.1 spec（YAML）
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: |
            spec 檔案未隨部署帶上（見 `web.py::_handle_openapi_spec`）——純
            文字 404，不假裝有 spec 可用，不套用 JSON 信封。
          content:
            text/plain:
              schema:
                type: string
              example: "OpenAPI spec 檔案未部署\n"

  /llms.txt:
    get:
      tags: [meta]
      operationId: getLlmsTxt
      summary: AI agent 一頁式指南（繁中+英文對照，站根路徑，非 `/api/*` 底下）
      description: |
        純 stdlib 讀檔回傳，見 `web.py::_handle_llms_txt`。不設限流（零依賴
        讀檔），不套用 `{ok,data,error}` 信封。react/nginx 拓樸下這條路由
        由 nginx 直接靜態回應 `frontend/public/llms.txt`（Vite build 進
        dist 根目錄），不經過這支 python handler——兩份檔案內容須逐字元
        一致（見 `tests/test_ai_friendly_api.py::
        test_llms_txt_root_and_frontend_public_copy_are_byte_identical`）。
      responses:
        "200":
          description: agent 指南純文字（繁中+英文對照）
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: |
            `llms.txt` 未隨部署帶上——純文字 404，不假裝有指南可用，不套用
            JSON 信封。
          content:
            text/plain:
              schema:
                type: string
              example: "llms.txt 未部署\n"

  /api/admin/backend-providers:
    get:
      tags: [admin]
      operationId: getAdminBackendProviders
      summary: 讀取管理面可用後端 provider 狀態
      security:
        - AdminToken: []
      description: |
        回傳 admin backend provider registry 的目前狀態，供管理面切換或檢查
        AgentCore / Bedrock / mock backend 可用性。此路徑屬於 `/api/admin/*`
        管理面，未設定或未通過 `ADMIN_TOKEN` 時維持 fail-closed。
      responses:
        "200":
          description: 後端 provider 狀態清單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          description: admin token 缺失或錯誤
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: admin 未啟用時與不存在路徑一致的 fail-closed 回應
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/admin/config:
    get:
      tags: [admin]
      operationId: getAdminConfig
      summary: 讀取管理面運行時設定（config 層當前值 + env/default 原始值對照 + effective/source 生效判定）
      security:
        - AdminToken: []
      description: |
        回傳 config 層（管理面寫入、存於 DynamoDB 保留字 item）的當前值，
        並附 env 層原始字串（`TRUSTFORGE_BEDROCK_DAILY_USD_CAP`，不解析、
        如實顯示）與 default 層（$3.0）供對照。

        `effective`/`source` 生效值判定欄位（PR-3 落地）：三層 fallback
        config → env → default 的生效值，直接取自 `budget_guard`／live 閘
        實際採用的同一套函式（不另行重算），「顯示的生效值」就是「分析
        路徑真的用的值」。注意 effective 走分析熱路徑的 15s TTL 快取視角
        （本 process 的 PUT write-through 立即一致；跨 process 讀到的是
        ≤15s 內收斂的真實生效值，如實反映傳播狀態）。

        token 安全：live token 只回 `config_configured`（bool）＋
        `config_last4`（末 4 碼，短 token 時為 null）＋ `env_configured`
        （bool）——**絕不**回明文或完整 hash。

        認證（所有 `/api/admin/*` 共通）：
        - header `X-Admin-Token`（`hmac.compare_digest` 恆定時間比對，
          雙邊先 sha256 定長化，連 token 長度都不洩）。**無 query 參數
          fallback**——token 絕不進 URL/access log。
        - 認證失敗一律 401，訊息不區分「未帶」vs「帶錯」（不給 oracle）。
        - 認證失敗 per-IP 限流：10 次/5 分鐘，超限 429（lockout-first：
          鎖定期間不執行比對，連正確 token 也 429，5 分鐘自癒）。
        - `TRUSTFORGE_ADMIN_TOKEN` 未設/空/與 `TRUSTFORGE_LIVE_TOKEN`
          相同 → 管理面全關（fail-closed），見 admin tag 說明。
      responses:
        "200":
          description: 當前設定（config 層 + env/default 對照）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminConfigData"
              example:
                ok: true
                data:
                  daily_cap_usd: {config: 1.0, env: "3.0", default: 3.0, effective: 1.0, source: config}
                  bedrock_enabled: {config: true, bedrock_model_id_set: true, effective: true, source: config}
                  live_token: {config_configured: true, config_last4: "a9f2", env_configured: false, effective_configured: true, source: config}
                  version: 7
                  updated_at: "2026-07-07T03:00:00+00:00"
                  updated_by: "admin@203.0.113.5"
                  exists: true
                  version_corrupt: false
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/AdminDisabled"
        "429":
          $ref: "#/components/responses/AdminAuthRateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
    put:
      tags: [admin]
      operationId: putAdminConfig
      summary: 部分更新運行時設定（CAS 樂觀鎖，`expected_version` 必填）
      security:
        - AdminToken: []
      description: |
        整個 server 唯一的寫入端點。body 欄位皆選填＝部分更新，但
        `expected_version` 必填（CAS：先 GET 拿 `version`，衝突回 409
        附 `current_version`，前端重載再改）。

        - `daily_cap_usd`：`0.1 ≤ x ≤ 50` 的有限數字，否則 400
          `invalid_cap`。**不接受 ≤ 0**——「cap ≤ 0＝緊急全關」語意保留
          給 env 逃生口，管理面的「關」統一走 `bedrock_enabled=false`。
          `null`＝清除 config 層（回落 env/default）。
        - `bedrock_enabled`：嚴格 bool（`"true"` 字串不算）。`true` 但
          `BEDROCK_MODEL_ID` env 未設 → 仍寫入，回應 `warnings` 附
          「開關開了也不會有真呼叫」誠實警告。`null`＝清除 config 層
          開關（回落下一層：env/default，見 PR-3 budget_guard 整合）。
        - `live_token`：長度 24–512 的可見 ASCII（0x21–0x7E）明文，
          server 落庫前轉 sha256（明文不落庫、不進審計、**不回顯**）。
          `null`＝清除 runtime token（回落 env token）。
        - body 上限 4 KB（413）、`Content-Type: application/json`（415）、
          須帶有效 `Content-Length`（411）、JSON 解析失敗/非 object（400）。

        成功 → 200 + 與 GET 相同的 data 結構（新狀態）＋ `warnings`
        字串陣列（含審計側路寫入失敗的 best-effort 警告），並同步失效
        本 process 設定快取（write-through）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              additionalProperties: false
              properties:
                daily_cap_usd:
                  type: [number, "null"]
                  minimum: 0.1
                  maximum: 50
                bedrock_enabled:
                  type: [boolean, "null"]
                live_token:
                  type: [string, "null"]
                  minLength: 24
                  maxLength: 512
                expected_version:
                  type: integer
                  minimum: 0
                  description: 剛讀到的 `version`；item 尚不存在（`exists=false`）時傳 0
            example:
              daily_cap_usd: 1.0
              bedrock_enabled: true
              expected_version: 7
      responses:
        "200":
          description: 寫入成功，回新狀態（結構同 GET）＋ `warnings`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/AdminConfigData"
                          - type: object
                            required: [warnings]
                            properties:
                              warnings:
                                type: array
                                items:
                                  type: string
        "400":
          description: |
            驗證失敗——`invalid_cap`（cap 越界/非有限數/非數字）或
            `bad_request`（`expected_version` 缺席/不合法、無任何設定
            欄位、不支援的欄位、bedrock_enabled 非嚴格 bool、live_token
            不符長度/字元集規則、JSON 解析失敗）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
              example:
                ok: false
                error:
                  code: invalid_cap
                  message: "daily_cap_usd 須為 0.1 至 50.0 之間的數字（緊急全關請用 bedrock_enabled=false，不接受 cap ≤ 0）"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "405":
          $ref: "#/components/responses/AdminDisabledPut"
        "409":
          description: |
            CAS 衝突：`expected_version` 不是當前值（寫入期間有別人先改
            了設定）。`error.current_version` 附最新 version（重讀失敗時
            為 null），前端重載最新設定後再改。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrEnvelope"
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          current_version:
                            type: [integer, "null"]
              example:
                ok: false
                error:
                  code: version_conflict
                  message: "設定已被他人變更，請重新讀取最新設定後再改"
                  current_version: 9
        "411":
          description: 缺少有效的 `Content-Length`（`length_required`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
        "413":
          description: body 超過 4 KB 上限（`payload_too_large`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
        "415":
          description: "`Content-Type` 不是 `application/json`（`unsupported_media_type`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
        "429":
          $ref: "#/components/responses/AdminAuthRateLimited"
        "500":
          description: |
            `version_corrupt`：config item 的 `version` 欄位損毀（非
            int）——CAS 對任何 `expected_version` 都不可能成功，重試無效，
            需人工修復（SOP 見 `admin_config.py` 模組頂部）。刻意與 409
            區分：409 暗示「重讀再試即可」，這種損毀狀態不行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
              example:
                ok: false
                error:
                  code: version_corrupt
                  message: "設定 version 欄位損毀，需人工修復後才能再寫入（非並發衝突，重試無效）"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/admin/audit:
    get:
      tags: [admin]
      operationId: getAdminAudit
      summary: 近 N 筆設定變更審計（唯讀，同 admin 認證）
      security:
        - AdminToken: []
      description: |
        時間降序回傳設定變更紀錄（DynamoDB 審計 item，best-effort 雙寫的
        另一份在 systemd journal）。token 類欄位的 old/new 一律是遮罩值
        （`"<set>"`/`"<cleared>"`/`"<rotated last4=xxxx>"`），絕無明文/
        hash。`limit` 有效範圍 1-200、預設 50；超過 200 是**靜默 clamp
        成 200**（不是 400，唯讀端點寬鬆處理）；非正整數才 400。
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            回看筆數，1 以上整數，預設 50。傳超過 200 的值不會 400，
            會被靜默 clamp 為 200（故本欄位 schema 不標 `maximum`，
            避免暗示「超過就錯誤」——實際只有非正整數才是 400）。
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: 審計紀錄（時間降序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [limit, records]
                        properties:
                          limit:
                            type: integer
                          records:
                            type: array
                            items:
                              $ref: "#/components/schemas/AdminAuditRecord"
        "400":
          description: "`limit` 非正整數"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/AdminDisabled"
        "429":
          $ref: "#/components/responses/AdminAuthRateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/admin/hermes-upgrades:
    get:
      tags: [admin]
      operationId: getAdminHermesUpgrades
      summary: 讀取持久化升級候選、sandbox 與人工決策稽核鏈
      security: [{AdminToken: []}]
      responses:
        "200":
          description: SQLite 升級佇列完整狀態
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OkEnvelope"}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
        "429": {$ref: "#/components/responses/AdminAuthRateLimited"}
        "502": {$ref: "#/components/responses/UpstreamError"}

  /api/admin/hermes-upgrade-sandbox:
    post:
      tags: [admin]
      operationId: recordAdminHermesUpgradeSandbox
      summary: 寫入候選 artifact 的 sandbox 驗證結果（不會啟用）
      security: [{AdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_id, passed, artifact_hash]
              properties:
                proposal_id: {type: string}
                passed: {type: boolean}
                artifact_hash: {type: string}
                details: {type: object}
      responses:
        "200": {description: Sandbox 結果已持久化}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
        "409": {description: 候選狀態不允許此轉換}
        "429": {$ref: "#/components/responses/AdminAuthRateLimited"}

  /api/admin/hermes-upgrade-decision:
    post:
      tags: [admin]
      operationId: decideAdminHermesUpgrade
      summary: 人工核准或拒絕候選；核准不等於自動部署
      security: [{AdminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_id, decision, actor, reason]
              properties:
                proposal_id: {type: string}
                decision: {type: string, enum: [approve, reject]}
                actor: {type: string}
                reason: {type: string}
      responses:
        "200": {description: 人工決策已寫入不可覆寫稽核紀錄}
        "401": {$ref: "#/components/responses/AdminUnauthorized"}
        "409": {description: 核准前尚未通過 sandbox 或已有終局決策}
        "429": {$ref: "#/components/responses/AdminAuthRateLimited"}

components:
  schemas:
    OkEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          description: 端點各自定義的 payload，見各路徑的 `data` schema
          type: object

    ErrEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                機器可讀錯誤代碼。公開端點只會出現：`bad_request` /
                `rate_limited` / `timeout` / `upstream_error`；
                `/api/admin/*` 管理面另有：`unauthorized` / `not_found` /
                `method_not_allowed` / `invalid_cap` / `version_conflict` /
                `version_corrupt` / `length_required` / `payload_too_large` /
                `unsupported_media_type`
              enum:
                - bad_request
                - rate_limited
                - timeout
                - upstream_error
                - unauthorized
                - not_found
                - method_not_allowed
                - invalid_cap
                - version_conflict
                - version_corrupt
                - length_required
                - payload_too_large
                - unsupported_media_type
            message:
              type: string
              description: 通用中文訊息，刻意不透傳例外 stacktrace/內部依賴細節

    AdminConfigData:
      type: object
      description: |
        `GET/PUT /api/admin/config` 共用的設定檢視：各層原始值對照 +
        `effective`/`source` 生效值判定（PR-3 落地：三層 fallback
        config → env → default，生效值直接取自分析路徑真的在用的同一批
        函式——`budget_guard.daily_cap_usd_resolved` / `web._bedrock_allowed`
        ——不另行重算，避免顯示值與實際採用值分岔）。token 相關只有
        configured bool + 末 4 碼，絕無明文/完整 hash。
      required: [daily_cap_usd, bedrock_enabled, live_token, version, updated_at, updated_by, exists, version_corrupt]
      properties:
        daily_cap_usd:
          type: object
          required: [config, env, default, effective, source]
          properties:
            config:
              type: [number, "null"]
              description: config 層當前值（null＝未設定/已清除）
            env:
              type: [string, "null"]
              description: "`TRUSTFORGE_BEDROCK_DAILY_USD_CAP` env 原始字串（不解析、如實顯示供對照，可能是壞值）"
            default:
              type: number
              description: 程式內建保守預設（$3.0）
            effective:
              type: number
              description: 分析路徑當下實際生效的 cap（三層 fallback 解析後的值）
            source:
              type: string
              enum: [config, env, default]
              description: 生效層（config 讀取異常時如實落 env/default）。例外：env cap ≤ 0＝緊急全關 kill-switch，最高優先凌駕 config（此時 source=env、effective ≤ 0，config 有值也不生效）
        bedrock_enabled:
          type: object
          required: [config, bedrock_model_id_set, effective, source]
          properties:
            config:
              type: [boolean, "null"]
            bedrock_model_id_set:
              type: boolean
              description: "`BEDROCK_MODEL_ID` env 是否已設（開關與 model id 是 AND 關係，只回 bool 不回值）"
            effective:
              type: boolean
              description: live 閘當下實際開閉（config bedrock_enabled AND env model，AND 後結果）
            source:
              type: string
              enum: [config, env, config_read_error]
              description: 生效層；config 未設定過＝env（v0.7.0 語意）；config_read_error＝讀取異常 fail-closed。注意 env 亦涵蓋「`BEDROCK_MODEL_ID` 未設 → 直接短路 false、不讀 config」分支（生效與否確實由 env 決定）
        live_token:
          type: object
          required: [config_configured, config_last4, env_configured, effective_configured, source]
          properties:
            config_configured:
              type: boolean
            config_last4:
              type: [string, "null"]
              description: 末 4 碼；token 過短（<16 字元）時為 null（避免 last4 洩露過半明文）
            env_configured:
              type: boolean
              description: "`TRUSTFORGE_LIVE_TOKEN` env 是否已設（只回 bool 不回值）"
            effective_configured:
              type: boolean
              description: 生效層是否有 token 可比對（config hash 優先，否則 env；token 值本身絕不回傳）
            source:
              type: string
              enum: [config, env, none, config_read_error]
              description: 生效層；config 有 hash＝config（env 舊 token 隨即失效）
        version:
          type: [integer, "null"]
          description: CAS 樂觀鎖版本；item 不存在（`exists=false`）時為 null，PUT 傳 `expected_version=0`
        updated_at:
          type: [string, "null"]
        updated_by:
          type: [string, "null"]
        exists:
          type: boolean
        version_corrupt:
          type: boolean
          description: item 存在但 `version` 欄位損毀（需人工修復，見 PUT 的 500 說明）

    AdminAuditRecord:
      type: object
      properties:
        ts:
          type: [string, "null"]
        actor:
          type: [string, "null"]
          description: "`admin@<client_ip>`（單 token 模型下 actor 粒度＝IP+時間）"
        changes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              old: {}
              new: {}
          description: token 類欄位 old/new 一律是遮罩值，絕無明文/hash
        version_from:
          type: [integer, "null"]
        version_to:
          type: [integer, "null"]
        user_agent:
          type: [string, "null"]

    StatusData:
      type: object
      required:
        - version
        - uptime_seconds
        - bedrock_capable
        - live_token_set
        - cache_backend
        - freshness
        - dedup
      properties:
        version:
          type: string
        uptime_seconds:
          type: number
        bedrock_capable:
          type: boolean
          description: |
            live 閘當下實際開閉（PR-3 起為動態閘：config `bedrock_enabled`
            AND env `BEDROCK_MODEL_ID`，每請求動態判定，不再是啟動時定死
            的 env 快照）。config 讀取異常時 fail-closed 回 false。
        live_token_set:
          type: boolean
          description: |
            live token 是否已設定（PR-3 起動態判定：config store 的 token
            hash 優先，未設則落 env `TRUSTFORGE_LIVE_TOKEN`；管理面輪替
            後不需重啟即反映）。只回 bool，token 值/hash 絕不回傳。
        cache_backend:
          type: object
          required: [name, connected, primary_connected, active_backend, degraded]
          properties:
            name:
              type: string
              description: primary backend 類名（例如 `DynamoDBCache`/`JsonCacheBackend`）
            connected:
              type: boolean
              description: 與 `primary_connected` 語意一致（收斂後的舊欄位，不再無條件寫 true）
            primary_connected:
              type: boolean
              description: primary backend 是否真的親自答對（沒有任何一格靠 fallback）
            active_backend:
              type: string
              description: 這次請求實際拿資料的 backend 類名；degraded 時等於 `JsonCacheBackend`
            degraded:
              type: boolean
              description: "`primary_connected` 的反面：true 代表這次回應是降級模式的結果"
        freshness:
          type: object
          required: [fresh, stale, missing, entries]
          properties:
            fresh:
              type: integer
            stale:
              type: integer
            missing:
              type: integer
            entries:
              type: array
              items:
                type: object
                required: [source, coin, status]
                properties:
                  source:
                    type: string
                  coin:
                    type: string
                  status:
                    type: string
                    enum: [fresh, stale, missing]
                  fetched_at:
                    type: [string, "null"]
                  age_seconds:
                    type: [number, "null"]
        dedup:
          type: object
          description: dedup coin_key 準備失敗（fail-open）的滑動視窗健康狀態
        docs:
          type: object
          description: |
            AI-friendliness 指引指標，指向本 spec 與 `/llms.txt`（純附加欄位，
            不影響既有讀取端）。
          properties:
            openapi:
              type: string
              const: /api/openapi.yaml
            llms_txt:
              type: string
              const: /llms.txt

    LedgerSummary:
      type: object
      required: [total_cost_usd, by_model, by_model_detail, run_count, runs]
      properties:
        total_cost_usd:
          type: number
          description: 全部歷史紀錄的累計花費（USD），不受 `runs` 有界截斷影響
        by_model:
          type: object
          description: model id → 累計花費（USD），涵蓋全部歷史紀錄
          additionalProperties:
            type: number
        by_model_detail:
          type: object
          description: model id → {cost_usd, tokens_in, tokens_out}，涵蓋全部歷史紀錄
          additionalProperties:
            type: object
            required: [cost_usd, tokens_in, tokens_out]
            properties:
              cost_usd:
                type: number
              tokens_in:
                type: integer
              tokens_out:
                type: integer
        run_count:
          type: integer
          description: 帳本真實總筆數（不受下方 `runs` 有界截斷影響）
        runs:
          type: array
          description: |
            只含最近 50 筆（`ledger.SUMMARY_RECENT_RUNS_CAP`），**不可**用
            `runs.length` 估算總筆數
          items:
            type: object

    TrustRadarEntry:
      type: object
      required: [label, has_data, trust, n_sources, n_evidence, single_source]
      properties:
        label:
          type: string
          description: 中文維度標籤
        has_data:
          type: boolean
          description: 本次分析是否有任何證據落在這個維度
        trust:
          type: [number, "null"]
          description: |
            該維度信任分（同 kind 證據的 `trust` 算術平均）。`has_data=false`
            時**恆為 `null`**——不用 `0` 冒充「有算過、分數低」。
        n_sources:
          type: integer
          description: 去重後的獨立來源數（`Evidence.source` 計）
        n_evidence:
          type: integer
        single_source:
          type: [boolean, "null"]
          description: "`n_sources <= 1`；`has_data=false` 時為 `null`"

    TrustComponentsAggregate:
      type: object
      description: |
        對 evidence 逐筆 `trust_components` 取算術平均，供顯示層呈現整體
        分項分布。**本輪所有 evidence 都沒有 `trust_components` 時，回傳空
        物件 `{}`**（不是四個鍵各自填 `0`）。
      properties:
        reputation:
          type: number
        corroboration:
          type: number
        recency:
          type: number
        manipulation:
          type: number
          description: |
            本輪 evidence 的操縱分項**平均值**——注意這是輔助判讀值，不是
            worst-case primary 訊號（primary 訊號見 `/api/overview` 的
            `manip_score`，此處聚合層目前無對應 worst-case 欄位）。

    PriceProvenance:
      type: object
      description: |
        任一來源本輪未取得（cache miss / 429 等）該 key 直接不存在，`ohlcv`／
        `live` 兩者皆缺時回空物件 `{}`。
      properties:
        ohlcv:
          $ref: "#/components/schemas/PriceProvenanceEntry"
        live:
          $ref: "#/components/schemas/PriceProvenanceEntry"

    PriceProvenanceEntry:
      type: object
      required: [content_reference, fetched_at, source_url]
      properties:
        content_reference:
          type: string
        fetched_at:
          type: string
        source_url:
          type: string
        data_lineage:
          $ref: "#/components/schemas/DataLineage"

    Evidence:
      type: object
      required:
        - source
        - fetched_at
        - content_reference
        - related_claim
        - source_url
        - kind
        - trust
        - trust_components
        - flags
        - info_flags
      properties:
        source:
          type: string
        fetched_at:
          type: string
          description: ISO8601 UTC
        content_reference:
          type: string
        related_claim:
          type: string
        source_url:
          type: string
        kind:
          type: string
          description: price/onchain/regulatory/hoyabit/news/social/price_live/sentiment/dev_activity
        trust:
          type: number
          description: 該筆證據的最終信任分（信譽×0.5 + 佐證×0.25 + 時效×0.15 − 操縱×0.40）
        trust_components:
          type: object
          description: |
            至少含 `reputation`/`corroboration`/`recency`/`manipulation` 四項
            分數；動態信譽開啟時另補
            `reputation_prior`/`reputation_final`/`reputation_agree_n`/
            `reputation_contradict_n`/`reputation_iterations_run`（可能缺席，
            視當輪是否啟用動態信譽而定，不代表值為 0）。
        flags:
          type: array
          items:
            type: string
          description: |
            **已判定**操縱關鍵詞命中清單，非空代表這筆證據已反映在
            `trust_components.manipulation` 扣分裡。
        info_flags:
          type: array
          items:
            type: string
          description: |
            informational-only 中性提示（例如多源文字高度相似）——**不代表
            已判定操縱、不影響 trust 分數**，純供人工判讀，不可等同 `flags`。
        data_lineage:
          $ref: "#/components/schemas/DataLineage"

    DataLineage:
      type: object
      description: 檔案型資料（例如主辦提供的五年 OHLCV）之可重現資料血緣；非檔案型 Evidence 可缺席。
      required: [dataset_role, dataset_name, file, sha256, rows, coverage, analysis_window, trading_pair, time_basis, interval, price_unit, columns]
      properties:
        dataset_role:
          type: string
          enum: [competition_baseline, local_ohlcv]
        dataset_name:
          type: string
        dataset_generated_at:
          type: string
        file:
          type: string
        sha256:
          type: string
          description: CSV 原始位元組的 SHA-256，供抽查檔案未遭替換。
        rows:
          type: integer
        coverage:
          type: object
          required: [start_date, end_date]
          properties:
            start_date:
              type: string
            end_date:
              type: string
        analysis_window:
          type: string
        trading_pair:
          type: string
        time_basis:
          type: string
        interval:
          type: string
        price_unit:
          type: string
        columns:
          type: array
          items:
            type: string

    BasisItem:
      type: object
      required: [claim, explanation, evidence_idx]
      properties:
        claim:
          type: string
        explanation:
          type: string
        evidence_idx:
          type: array
          items:
            type: integer

    Report:
      type: object
      required:
        - coin
        - question_type
        - question
        - market_judgment
        - facts
        - inferences
        - key_basis
        - confidence
        - limits
        - could_flip
        - contrarian
        - generated_at
        - direction
        - cross_source_signal
        - calibrated_confidence
        - decision_state
      properties:
        coin:
          type: string
        question_type:
          type: string
          enum: [multi_source, hypothesis, comparison]
        question:
          type: string
        market_judgment:
          type: string
        facts:
          type: array
          items:
            type: string
          description: 事實層（客觀、高信任）
        inferences:
          type: array
          items:
            type: string
          description: 推論層（Agent 推理，非外部承諾）
        key_basis:
          type: array
          items:
            $ref: "#/components/schemas/BasisItem"
        confidence:
          type: number
          description: |
            裸均值信任分（未校準），僅供對照——顯示/決策一律以
            `calibrated_confidence` + `decision_state` 為準，不要單獨用這個
            欄位判斷風險等級。
        limits:
          type: array
          items:
            type: string
          description: 已知限制／資料不足說明
        could_flip:
          type: array
          items:
            type: string
          description: 可能推翻結論的條件
        contrarian:
          type: array
          items:
            type: string
          description: 反方／低信任證據（已標記，未納入主結論）
        generated_at:
          type: string
        direction:
          type: string
          description: "偏多/偏空/中性/不明；`decision_state=abstain` 時固定為「不明」"
        cross_source_signal:
          type: [object, "null"]
          description: 跨源訊號背離/共識；無背離/無矛盾配對時為 `null`
        calibrated_confidence:
          type: number
          description: |
            校準後信心值（簡化版分位數校準，**非**嚴謹 conformal prediction
            覆蓋率承諾，不可轉述成正確度百分比或「肯定不會錯」之類的宣稱）。
        decision_state:
          type: string
          enum: [abstain, low_confidence, normal]
          description: |
            三態決策：`calibrated_confidence < 0.35` 或去重支撐來源數 `< 2`
            → `abstain`；非 abstain 且 `calibrated_confidence < 0.5` →
            `low_confidence`；其餘 → `normal`。缺鍵（舊格式資料）一律正規化
            為 `normal`（保守 fallback，不代表真的高信心）。

    AnalyzeSingleData:
      type: object
      required:
        - version
        - report
        - evidence
        - trust_radar
        - trust_components_aggregate
        - price_provenance
        - execution
        - execution_log
      properties:
        version:
          type: string
        report:
          $ref: "#/components/schemas/Report"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        trust_radar:
          type: object
          description: |
            鍵集合固定等於 9 個維度全集（price/onchain/regulatory/hoyabit/
            news/social/price_live/sentiment/dev_activity），不受 evidence
            內容影響
          additionalProperties:
            $ref: "#/components/schemas/TrustRadarEntry"
        trust_components_aggregate:
          $ref: "#/components/schemas/TrustComponentsAggregate"
        price_provenance:
          $ref: "#/components/schemas/PriceProvenance"
        execution:
          $ref: "#/components/schemas/ExecutionManifest"
        execution_log:
          type: array
          items:
            type: object
            required: [ts, elapsed_sec, tool, params, summary]
            properties:
              ts:
                type: string
              elapsed_sec:
                type: number
              tool:
                type: string
              params:
                type: object
                properties:
                  hermes:
                    type: object
                    required: [run_id, agent, node_id, node_label, node_order, status]
                    properties:
                      run_id:
                        type: string
                      agent:
                        type: string
                        enum: [hermes]
                      node_id:
                        type: string
                      node_label:
                        type: string
                      node_order:
                        type: integer
                      status:
                        type: string
                        enum: [started, observed, completed]
              summary:
                type: string

    AnalyzeComparisonData:
      type: object
      required:
        - version
        - report_a
        - evidence_a
        - trust_radar_a
        - trust_components_aggregate_a
        - price_provenance_a
        - report_b
        - evidence_b
        - trust_radar_b
        - trust_components_aggregate_b
        - price_provenance_b
        - execution
        - execution_log
      properties:
        version:
          type: string
        report_a:
          $ref: "#/components/schemas/Report"
        evidence_a:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        trust_radar_a:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TrustRadarEntry"
        trust_components_aggregate_a:
          $ref: "#/components/schemas/TrustComponentsAggregate"
        price_provenance_a:
          $ref: "#/components/schemas/PriceProvenance"
        report_b:
          $ref: "#/components/schemas/Report"
        evidence_b:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        trust_radar_b:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TrustRadarEntry"
        trust_components_aggregate_b:
          $ref: "#/components/schemas/TrustComponentsAggregate"
        price_provenance_b:
          $ref: "#/components/schemas/PriceProvenance"
        execution:
          $ref: "#/components/schemas/ExecutionManifest"
        execution_log:
          type: array
          description: 兩幣共用同一份 execution log（同一次請求內先後跑 A、B 兩次分析）
          items:
            type: object

    ExecutionManifest:
      type: object
      required: [agent, run_id, started_at, elapsed_sec, budget_sec, nodes]
      properties:
        agent:
          type: string
          enum: [hermes]
        run_id:
          type: string
        started_at:
          type: string
        elapsed_sec:
          type: number
        budget_sec:
          type: integer
          enum: [900]
        nodes:
          type: array
          items:
            type: object
            required: [id, label, order]
            properties:
              id:
                type: string
              label:
                type: string
              order:
                type: integer

    OverviewCoinSnapshot:
      type: object
      required: [coin, trust_score, direction, calibrated_confidence, decision_state, generated_at]
      properties:
        coin:
          type: string
        trust_score:
          type: number
          description: 對應 `Report.confidence`（裸均值，非校準值）
        direction:
          type: string
        calibrated_confidence:
          type: number
        decision_state:
          type: string
          enum: [abstain, low_confidence, normal]
        generated_at:
          type: string
        fetched_at_epoch:
          type: [number, "null"]
          description: 快照寫入時的 epoch 秒（cache entry 的 `fetched_at`）
        reputation_trace:
          type: object
          description: |
            **可能缺席**——只有 evidence 帶有動態信譽 trace 資料時才出現，
            缺席不代表信譽為 0 或未追蹤。鍵為來源名稱，值含
            `prior`/`final`/`delta`/`agree_n`/`contradict_n`。
        manip_score:
          type: number
          description: |
            **可能缺席**——只有本輪 evidence 至少一筆算出操縱分項時才出現。
            worst-case（`max()`），是操縱風險判斷的 **primary** 訊號。缺席
            **不代表無操縱風險**，代表本輪快照沒有可用的操縱訊號。
        manip_score_mean:
          type: number
          description: |
            **可能缺席**（與 `manip_score` 同時出現或同時缺席）——算術平均，
            僅供輔助判讀，**不參與**任何風險分級。

    HistoryEntry:
      type: object
      description: |
        `_snapshot_dict()` 原樣內容（`web.py::get_trust_history()` 直接
        `dict(docs[0])`，跟 `OverviewCoinSnapshot` 讀的是同一份底層儲存
        結構）另外補上 `date` 欄位——因此 `reputation_trace`／`manip_score`／
        `manip_score_mean` 缺席語意跟 `OverviewCoinSnapshot` 完全一致。

        **唯一例外**：`fetched_at_epoch` 只在 `OverviewCoinSnapshot` 出現
        ——那是 `/api/overview` 額外從 cache envelope 本身的 `fetched_at`
        欄位另外組裝進去的（不屬於 `_snapshot_dict()` 內容本身），`/api/
        history` 這裡**永遠不會**帶這個欄位（不是碰巧缺席，是這條路徑
        本來就不寫）。
      required: [date, coin, trust_score, direction, calibrated_confidence, decision_state, generated_at]
      properties:
        date:
          type: string
          description: "`YYYY-MM-DD`，該筆快照所屬日期（UTC）"
        coin:
          type: string
        trust_score:
          type: number
        direction:
          type: string
        calibrated_confidence:
          type: number
        decision_state:
          type: string
          enum: [abstain, low_confidence, normal]
        generated_at:
          type: string
        reputation_trace:
          type: object
          description: 可能缺席，語意同 `OverviewCoinSnapshot.reputation_trace`
        manip_score:
          type: number
          description: 可能缺席，語意同 `OverviewCoinSnapshot.manip_score`
        manip_score_mean:
          type: number
          description: 可能缺席，語意同 `OverviewCoinSnapshot.manip_score_mean`

  responses:
    RateLimited:
      description: |
        per-IP 滑動視窗超過門檻（見本文件頂部「Rate limit 語意」），無
        `Retry-After` header，秒數寫在 `error.message` 文字裡。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrEnvelope"
          example:
            ok: false
            error:
              code: rate_limited
              message: "請求過於頻繁，請 30 秒後再試"

    UpstreamError:
      description: 底層 cache/帳本/連接器讀取真的失敗（非合法 miss），不透傳例外細節
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrEnvelope"
          example:
            ok: false
            error:
              code: upstream_error
              message: "狀態資料暫時無法讀取，請稍後再試"

    AdminUnauthorized:
      description: |
        `X-Admin-Token` 未帶或不正確——訊息刻意不區分兩種情況（不給
        oracle）。比對為恆定時間（`hmac.compare_digest`，雙邊 sha256
        定長化）。失敗會計入 per-IP 失敗限流並記 log（IP+path，不記
        token 值）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrEnvelope"
          example:
            ok: false
            error:
              code: unauthorized
              message: "未授權"

    AdminDisabled:
      description: |
        `TRUSTFORGE_ADMIN_TOKEN` 未設/空/與 `TRUSTFORGE_LIVE_TOKEN` 相同
        （碰撞視同未設）→ 管理面 fail-closed 全關：GET 回與任何不存在
        路徑 **byte-identical 的 404 HTML 頁**（非 JSON 信封，連端點
        存在性都不暴露）。PUT 的全關行為不同、見 `AdminDisabledPut`。
      content:
        text/html:
          schema:
            type: string

    AdminDisabledPut:
      description: |
        `TRUSTFORGE_ADMIN_TOKEN` 未設/空/與 `TRUSTFORGE_LIVE_TOKEN` 相同
        （碰撞視同未設）→ 管理面 fail-closed 全關。PUT 語境下這台 server
        對「不存在/未開放的路徑」一律回 405（而非 404）——與 GET 的
        byte-identical 404 HTML 頁不同語意，故獨立成另一個 response 元件
        （PR #112 qa M2：先前誤把 GET/PUT 共用同一個 404 元件）。
      headers:
        Allow:
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrEnvelope"
          example:
            ok: false
            error:
              code: method_not_allowed
              message: "此路徑不支援 PUT"

    AdminAuthRateLimited:
      description: |
        認證失敗 per-IP 限流：5 分鐘視窗內失敗 ≥10 次 → 429（lockout-
        first：鎖定期間不執行 token 比對，連正確 token 也 429，視窗
        滑過自癒）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrEnvelope"
          example:
            ok: false
            error:
              code: rate_limited
              message: "認證失敗次數過多，請 300 秒後再試"

  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: |
        管理面獨立 token（`TRUSTFORGE_ADMIN_TOKEN` env，信任根只在 env、
        輪替＝改 env + restart）。與分析用 `X-Live-Token` 是**不同權限
        層級的不同 token**，不可共用（server 啟動期檢查碰撞，相同即
        全關管理面）。**無 query 參數 fallback**——token 絕不進 URL。

openapi: 3.1.0
info:
  title: TrustForge JSON API
  version: "0.2.0"
  summary: >-
    加密市場分析 AI Agent 的信任情報 API——多源資料 + 可解釋的信任評分，
    供人與 AI agent 兩種使用者共同消費同一份結構化契約。
  description: |
    # 這份文件是什麼（What this is）

    TrustForge 對某個幣種（`BTC`/`ETH`/`SOL`/`BNB`/`XRP`）的市場問題，彙整多個
    獨立資料來源（價格 OHLCV、鏈上、監管、交易所、新聞、社群、CoinGecko 即時
    報價/情緒/開發活動），逐筆計算「信任分」（信譽 × 0.5 ＋ 佐證 × 0.25 ＋
    時效 × 0.15 − 操縱 × 0.40），再彙整成結構化報告。這份 spec 是本 repo
    `src/trustforge/web.py` 內 `_handle_api_*` 系列 handler 的**逐一對照**
    （非另案文件轉抄——AWS-ARCHITECTURE.md 端點表過去曾三處與實際程式碼不符，
    被 codex 抓出；本檔每個欄位都對照過真實回應）。

    This document is a field-by-field mirror of the actual handler code in
    `src/trustforge/web.py` (`_handle_api_health` / `_handle_api_status` /
    `_handle_api_costs` / `_handle_api_overview` / `_handle_api_history` /
    `_handle_api_analyze`) — not transcribed from prose docs, which have
    previously drifted from the real responses.

    # 誠實設計鐵律（Honesty invariants — read this before parsing anything）

    1. **缺鍵＝未評估，不是零／安全（Missing key means "not evaluated", never
       zero or safe）。** 本 API 多處欄位在「沒有算過」時**完全省略該鍵**，
       而不是填 `0`、`null` 佔位假裝「查過、結果是低風險/低分」。呼叫端
       （尤其 AI agent）**必須**把「鍵不存在」與「鍵存在但值為 0」視為兩種
       不同語意，不可用 `.get(key, 0)` 這種預設值語意讀取後直接拿去做風險
       判斷。典型例子：
       - `trust_radar.<kind>.trust`：該維度完全沒有證據時是 `null`
         （`has_data: false`），不是 `0`（`0` 代表「有算過、分數就是 0」，
         語意完全不同）。
       - `trust_components_aggregate`：本輪所有證據都沒有 `trust_components`
         時整個回傳 `{}`（空物件），不是四個鍵各自填 `0`。
       - `/api/overview` 的 `coins[].manip_score` / `manip_score_mean`：
         只有在該幣本輪快照的 evidence 內至少一筆算出操縱分項時才會出現這
         兩個鍵；完全缺席時**不代表「無操縱風險」**，而是「這輪快照沒有可
         用的操縱訊號」（例如尚未排程過、或該輪 evidence 為空）——UI／agent
         看到鍵不存在時必須顯示「未評估」，不可預設安全。
       - `coins[].reputation_trace`：只有在 evidence 帶有動態信譽 trace 時
         才出現，缺席不代表信譽為 0 或未追蹤。

    2. **`manip_score`（worst-case, `max()`）才是操縱風險的 primary 訊號，
       不是 `manip_score_mean`。** 15 筆證據里只要有 1 筆已確認操縱
       （`manipulation=1.0`），平均會被稀釋到看起来很低——這是刻意設計：
       信任產品的操縱風險徽章必須滿足「只要出現一筆已確認操縱，就不可能
       顯示低風險」這個不變量，只有 `max()` 能在證據筆數/來源分布任意變動
       下維持這個不變量。`manip_score_mean` 純粹是輔助判讀（"這批證據平均
       而言如何"），**不參與**任何風險分級判斷，UI/agent 若只能顯示一個
       數字，一律顯示 `manip_score`。

    3. **信任分是校準式打分，不是統計承諾（Calibration, not a statistical
       promise）。** `report.calibrated_confidence` 是簡化版分位數校準
       （quantile calibration），**不是**嚴謹 conformal prediction 的覆蓋率
       （coverage）承諾——不可把它包裝或轉述成任何形式的正確度百分比或
       「肯定不會錯」之類的宣稱。信任分/資訊完整度只反映「本輪可取得的多源
       證據，依既定公式加權後的相對強弱」，**不是**投資建議、不是對未來
       價格走勢的精準度承諾。

    4. **三態決策（decision_state）：`abstain` / `low_confidence` /
       `normal`。** `report.decision_state` 由
       `agent.orchestrator.build_report` 依下列規則之一決定（皆為即時計算
       的結構化欄位，非事後貼標）：
       - `abstain`：`calibrated_confidence < 0.35` **或**去重後獨立支撐
         來源數 `< 2`——代表「證據不足，刻意不給方向性結論」，`report.
         direction` 固定為 `"不明"`，`market_judgment` 是中性的「資料不足」
         陳述，不含任何偏多/偏空字眼。
       - `low_confidence`：非 abstain 且 `calibrated_confidence < 0.5`——
         有給方向性判斷，但信心偏低。
       - `normal`：以上皆非——證據強度足以支持一個有信心的方向性判斷。
       任何舊格式資料（歷史快照/測試手造 Report）缺這個鍵時，讀取端一律
       正規化為 `"normal"`（向後相容 fallback，不代表真的是高信心，只是
       「無法判斷三態、假設是正常態」的保守處理）。

    5. **`{ok, data, error}` 統一信封。** 所有 `/api/*` 端點成功一律
       `{"ok": true, "data": {...}}`；失敗一律
       `{"ok": false, "error": {"code": "...", "message": "..."}}`，`message`
       是通用中文訊息（刻意不透傳例外 stacktrace / DynamoDB 錯誤細節，避免
       洩露內部依賴資訊給大量掃描/爬取的請求）。同源、不開 CORS、全部唯讀。

    6. **Rate limit 語意（見各端點 `429` 回應）：** 依端點分成三組獨立
       per-IP 滑動視窗 bucket，超過門檻回 `429` + `{"code":"rate_limited"}`，
       訊息內含視窗秒數但**不含** `Retry-After` header（純文字訊息裡的秒數
       即為建議重試等待時間）：
       - `/api/status`、`/api/costs`、`/api/overview`、`/api/history`
         **四個端點共用同一個 per-IP bucket**（見
         `web.py::_check_status_rate_limit`，唯一鍵是 IP，不分端點）：
         30 秒滑動視窗內，同一 IP 呼叫這四個端點的次數**合計**最多 10 次
         ——不是「每個端點各自 10 次」。agent 若同時輪詢多個端點，配額是
         互相扣抵的，須自行控制混合呼叫頻率。
       - `/api/analyze`：依當次生效模式決定——`live=1`（真 Bedrock）走
         60 秒視窗內每 IP 最多 5 次的緊門檻；預設「真資料·$0」模式
         （未帶 `live`/`sample` 參數即生效）走 60 秒視窗內每 IP 最多 60 次
         的寬鬆門檻（純讀快取/連接器，不打 LLM，成本為 $0）。這組 bucket
         與上面四個 observability 端點**各自獨立**，互不共用、互不扣抵。
       - `/api/health`、`/api/openapi.yaml`、`/llms.txt`：不設限流（零 I/O，
         無任何 cache/連接器讀取，純讀檔或純記憶體運算）。

    7. **依賴失敗 → `502`，不是悄悄降級成 `200` 的假資料。** 除
       `/api/health` 外的所有端點，其底層 cache/帳本讀取若真的失敗（非
       「查無資料」的合法 miss），一律回 `502` +
       `{"code":"upstream_error"}`，不會回傳看起來正常但其實是佔位/降級
       的 `200`。唯一例外是 `/api/status` 的 primary→fallback 降級：primary
       backend（DynamoDB）失敗但本地 `JsonCacheBackend` fallback 讀得到時，
       仍回 `200`，但會誠實回報 `degraded: true` /
       `primary_connected: false`（見 `StatusData` schema），不會假裝
       primary 正常。

    # 給 AI agent 的最短路徑（TL;DR for agents）

    - 先看 `/llms.txt`（一頁式指南，繁中+英文對照）。
    - 想要一句話分析：`GET /api/analyze?coin=BTC&type=multi_source&q=...`。
    - 只看信任分/決策狀態就好：讀 `data.report.calibrated_confidence` +
      `data.report.decision_state`，不要只看 `data.report.confidence`
      （那是未校準裸均值，僅供對照）。
    - 任何欄位缺席 → 視為「未評估」，不要假設為 0 或安全。

servers:
  - url: /
    description: 同源部署（SSR python 直接對外，或 nginx 反代 /api/* 給 python）

tags:
  - name: meta
    description: 健康檢查、自我描述
  - name: analysis
    description: 核心分析端點
  - name: observability
    description: 狀態/成本/總覽/歷史等唯讀觀測端點
  - name: admin
    description: |
      管理面（運行時設定 + 審計）——**非公開端點**，僅供管理員使用，
      刻意不列入 `/llms.txt` agent 指南。`TRUSTFORGE_ADMIN_TOKEN` env
      未設定時整個 `/api/admin/*` fail-closed 全關：GET 回與任何不存在
      路徑 byte-identical 的 404 HTML 頁、PUT 回與其他一切路徑相同的
      405——連端點存在性都不暴露。

paths:
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: JSON 版健康檢查（零 I/O，無 rate limit）
      description: |
        比照既有純文字 `/healthz` 之外，補一個 JSON 版本供偏好 JSON 回應格式
        的健康檢查探針使用。本端點沒有任何 backend/ledger 依賴，理論上不會
        回 502，但仍統一包一層防禦邊界。
      responses:
        "200":
          description: 服務存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
              example:
                ok: true
                data:
                  status: ok
                  version: dev
                  uptime_seconds: 123.456
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/rate-limit-status:
    get:
      tags: [observability]
      operationId: getRateLimitStatus
      summary: 速率限制狀態與統計（唯讀觀測，不需 admin token）
      description: |
        暴露目前各限流 bucket（live / real / status / online_stance）的設定值
        （window / max）與即時統計（追蹤 IP 數、視窗內請求數）。不暴露完整 IP
        位址，僅回傳聚合計數。供前端或監控層掌握限流健康狀況。
      responses:
        "200":
          description: 各 bucket 的設定與即時統計
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          buckets:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                window_seconds:
                                  type: integer
                                max_requests_per_ip:
                                  type: integer
                                stats:
                                  type: object
                                  properties:
                                    active_ips:
                                      type: integer
                                    total_requests_in_window:
                                      type: integer
                                    tracked_ips:
                                      type: integer
                          max_tracked_ips:
                            type: integer
              example:
                ok: true
                data:
                  buckets:
                    live:
                      window_seconds: 60
                      max_requests_per_ip: 5
                      stats:
                        active_ips: 2
                        total_requests_in_window: 7
                        tracked_ips: 3
                    real:
                      window_seconds: 60
                      max_requests_per_ip: 60
                      stats:
                        active_ips: 1
                        total_requests_in_window: 3
                        tracked_ips: 1
                    status:
                      window_seconds: 30
                      max_requests_per_ip: 10
                      stats:
                        active_ips: 0
                        total_requests_in_window: 0
                        tracked_ips: 0
                    online_stance:
                      window_seconds: 3600
                      max_requests_per_ip: 20
                      stats:
                        active_ips: 0
                        total_requests_in_window: 0
                        tracked_ips: 0
                  max_tracked_ips: 5000

  /api/status:
    get:
      tags: [observability]
      operationId: getStatus
      summary: 連接器健康 / 資料鮮度 / 版本 / uptime（不含成本明細，見 /api/costs）
      description: |
        比 SSR `/status` 頁更保守：cache backend 探測失敗時**不**回傳原始
        例外訊息，只回通用訊息（機器可讀 API 更容易被大量掃描，不洩露
        DynamoDB 錯誤細節）。

        `cache_backend.degraded`／`primary_connected`／`active_backend`：
        primary（DynamoDB）與本地 `JsonCacheBackend` fallback 之間的降級語意
        ——fallback 成功仍回 `200`，但如實標記本次回應是降級模式的結果，
        不會無條件宣稱 primary 連線正常。
      parameters: []
      responses:
        "200":
          description: 狀態快照（可能為降級模式，見 `cache_backend.degraded`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StatusData"
              example:
                ok: true
                data:
                  version: dev
                  uptime_seconds: 12.3
                  bedrock_capable: false
                  live_token_set: false
                  cache_backend:
                    name: JsonCacheBackend
                    connected: true
                    primary_connected: true
                    active_backend: JsonCacheBackend
                    degraded: false
                  freshness:
                    fresh: 0
                    stale: 0
                    missing: 115
                    entries:
                      - source: alternative-me-fng
                        coin: BTC
                        status: missing
                        fetched_at: null
                        age_seconds: null
                  dedup:
                    healthy: true
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/costs:
    get:
      tags: [observability]
      operationId: getCosts
      summary: 成本帳本（累計花費 + 依 model 分組明細，有界摘要）
      description: |
        直接重用既有帳本 `Ledger.summary()`（20 秒 TTL + single-flight
        快取，與 `/status`／`/costs` 頁共用同一份真實累計數字）。

        `run_count` 才是帳本真實總筆數；`runs` 只含最近 50 筆
        （`ledger.SUMMARY_RECENT_RUNS_CAP`）——**不可**用 `runs.length`
        估算總筆數，帳本 >50 筆時會低估。
      responses:
        "200":
          description: 成本摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LedgerSummary"
              example:
                ok: true
                data:
                  total_cost_usd: 0.0234
                  by_model:
                    au.anthropic.claude-haiku-4-5-20251001-v1:0: 0.0234
                  by_model_detail:
                    au.anthropic.claude-haiku-4-5-20251001-v1:0:
                      cost_usd: 0.0234
                      tokens_in: 1200
                      tokens_out: 800
                  run_count: 3
                  runs: []
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/overview:
    get:
      tags: [observability]
      operationId: getOverview
      summary: 多幣總覽（讀既有排程快照，不觸發任何連接器/Bedrock 呼叫）
      description: |
        逐幣讀 `scripts/fetch_scheduler.py --snapshot` 既有寫入的
        `__trust_snapshot__:{coin}` 最新一筆快照，回傳結構化 JSON——刻意
        不是首頁用的預先渲染 HTML blob。某幣尚未排程寫過快照時，該幣**完全
        不出現**在 `coins` 陣列裡（不是補一筆空物件）。
      responses:
        "200":
          description: 總覽（`coins` 可能為空陣列，若尚無任何幣排程過快照）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [coins]
                        properties:
                          coins:
                            type: array
                            items:
                              $ref: "#/components/schemas/OverviewCoinSnapshot"
              example:
                ok: true
                data:
                  coins:
                    - coin: BTC
                      trust_score: 0.625
                      direction: 不明
                      calibrated_confidence: 0.4188
                      decision_state: abstain
                      generated_at: "2026-07-06T10:19:03Z"
                      fetched_at_epoch: 1751800743
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/history:
    get:
      tags: [observability]
      operationId: getHistory
      summary: 單幣 PIT（point-in-time）按日信任序列
      description: |
        讀既有排程按日寫入的快照序列，**只讀不寫**、不觸發任何連接器/
        Bedrock 呼叫。某天沒有排程寫過快照（合法 miss）直接跳過，不補假值
        ——`history` 陣列長度可能小於 `days`。
      parameters:
        - name: coin
          in: query
          required: false
          description: 幣種代碼，須為官方幣種池其中之一，大小寫不敏感（內部會轉大寫）
          schema:
            type: string
            enum: [BTC, ETH, SOL, BNB, XRP]
        - name: days
          in: query
          required: false
          description: 回看天數，含 `end_date`（預設今天 UTC）當天
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: 按日信任序列（由舊到新排序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [coin, days, history]
                        properties:
                          coin:
                            type: string
                          days:
                            type: integer
                          history:
                            type: array
                            items:
                              $ref: "#/components/schemas/HistoryEntry"
              example:
                ok: true
                data:
                  coin: BTC
                  days: 3
                  history: []
        "400":
          description: |
            `coin` 不在官方幣種池，或 `days` 不是 `[1, 90]` 之間的正整數。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrEnvelope"
              example:
                ok: false
                error:
                  code: bad_request
                  message: "幣種須為以下其中之一：BTC、ETH、SOL、BNB、XRP"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /api/data-plane-status:
    get:
      tags: [observability]
      operationId: getDataPlaneStatus
      summary: 資料層合併觀測（快取鮮度 + 快照狀態 + 操縱偵測模組）
      description: |
        合併三個觀測面向（issues #256, #257, #264）：
        - `cache_freshness`：各來源 × 各幣種的快取鮮度狀態統計。
        - `snapshots`：AnalysisFlow 中各幣種最新 snapshot 狀態。
        - `manipulation_detection`：操縱偵測模組能力描述與可用偵測器清單。

        不需 admin token、不觸發連接器/Bedrock 呼叫、純唯讀。任一子區塊
        讀取失敗時回傳 partial result（帶 error 欄位說明），不讓整個端點 502。
      responses:
        "200":
          description: 資料層合併觀測狀態
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cache_freshness:
                            type: object
                            description: 快取鮮度摘要（freshness.dashboard 輸出）
                          snapshots:
                            type: object
                            description: 各幣種最新 analysis snapshot 狀態
                            properties:
                              coins:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    snapshot_id:

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustforge"
dynamic = ["version"]
description = "加密市場分析 AI Agent：多源資訊的信任提煉（AWS Bedrock）"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",   # 唯一模型入口：AWS Bedrock runtime
    "certifi>=2024.2.2",  # 外部 HTTPS connector 的可攜式 CA trust store
    "portalocker>=3,<4",  # macOS/Linux/Windows cross-process store locks
    "cryptography>=44,<50",  # Ed25519 endpoint-manifest verification (#733)
    "jsonschema>=4.23,<5",  # Training/analysis JSON contracts are validated at web startup
    # issue #721：FSC VASP 登記業者名單只以 PDF 發布（無 API、無表格頁）。
    # 該 PDF 用 Type0/CIDFontType2 字型並把 ToUnicode CMap 放在壓縮物件流裡，
    # 手寫解析不可行。pypdf 是純 Python、無 C 相依，可直接在生產基底
    # python:3.12-slim 上跑，不需額外系統套件。
    "pypdf>=5,<7",
    "bedrock-agentcore>=1.9.1",
]

[project.optional-dependencies]
proposal = [
    "python-docx>=1.1,<2",
]
# #91 CI 品質閘：pytest-cov 讓 `[tool.pytest.ini_options].addopts` 的 --cov 生效。
# CI（.github/workflows/ci.yml）以 `pip install -e ".[dev]"` 安裝後直接跑 `pytest`，
# 若這裡沒帶 pytest-cov，addopts 的 --cov 會讓 pytest 報「unrecognized arguments」
# → CI 直接變紅。故新增 pytest-cov 是覆蓋率閘的必要相依。
dev = [
    "pytest>=8",
    "moto[dynamodb]>=5",
    "pytest-cov>=5",
    "pytest-xdist>=3,<4",
    "pytest-timeout>=2,<3",
    "jsonschema>=4,<5",
    "PyYAML>=6,<7",
]

[project.scripts]
trustforge = "trustforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "trustforge._version.VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Agent worktrees may live below the checkout and contain a second copy of the
# test suite.  Keep pytest's standard exclusions while naming both agent roots
# explicitly so this safety boundary remains visible if pytest defaults change.
norecursedirs = [
    "*.egg",
    ".*",
    ".Codex",
    ".codex",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
# #91 CI 品質閘：覆蓋率下限。目前全倉覆蓋率約 85%，設 75% 保留充足緩衝、
# 不會讓現有 CI（跑全倉）變紅，同時擋住「新程式碼大幅拉低覆蓋率」的回歸。
# ⛔ --cov-fail-under 由 .githooks/pre-push 顯式傳入，不放在 addopts 中——
#   放在 addopts 會讓單一測試檔也吃閥值（跑子集時全倉 9%→白爆）。
#   本機跑子集時仍可加 --no-cov 加速。
addopts = "--cov=trustforge --cov=trustforge_core"
timeout = 120
# Suppress benign GC-timing ResourceWarnings from sqlite3 connections.  All
# sqlite-backed stores (SourceEventArchive, TrustFeatureStore,
# SQLiteCacheBackend, AnalysisFlow) define close()+__del__, but Python's
# non-deterministic GC can collect Connection objects before the wrapper's
# __del__ runs during interpreter teardown, emitting "unclosed database"
# ResourceWarnings that are noise rather than real leaks.  This filter is
# narrowly scoped to the sqlite "unclosed database" message so genuine
# ResourceWarnings (sockets, files) remain visible.
filterwarnings = [
    "ignore:unclosed database:ResourceWarning",
]
markers = [
    "integration: tests requiring an explicitly enabled live local service",
    "slow: tests that are expected to exceed the normal fast-suite budget",
    "network: tests that perform real or simulated network-bound behavior",
    "serial: tests that must not run concurrently with related tests",
    "subprocess: tests that spawn external commands or child processes",
]

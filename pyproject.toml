[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustforge"
version = "0.2.0"
description = "加密市場分析 AI Agent：多源資訊的信任提煉（AWS Bedrock）"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",   # 唯一模型入口：AWS Bedrock runtime
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trustforge = "trustforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

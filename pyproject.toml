[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustforge"
version = "0.16.7"
description = "加密市場分析 AI Agent：多源資訊的信任提煉（AWS Bedrock）"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",   # 唯一模型入口：AWS Bedrock runtime
    "certifi>=2024.2.2",  # 外部 HTTPS connector 的可攜式 CA trust store
]

[project.optional-dependencies]
# #91 CI 品質閘：pytest-cov 讓 `[tool.pytest.ini_options].addopts` 的 --cov 生效。
# CI（.github/workflows/ci.yml）以 `pip install -e ".[dev]"` 安裝後直接跑 `pytest`，
# 若這裡沒帶 pytest-cov，addopts 的 --cov 會讓 pytest 報「unrecognized arguments」
# → CI 直接變紅。故新增 pytest-cov 是覆蓋率閘的必要相依。
dev = ["pytest>=8", "moto[dynamodb]>=5", "pytest-cov>=5"]

[project.scripts]
trustforge = "trustforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# #91 CI 品質閘：覆蓋率下限。目前全倉覆蓋率約 93%，設 75% 保留充足緩衝、
# 不會讓現有 CI（跑全倉）變紅，同時擋住「新程式碼大幅拉低覆蓋率」的回歸。
# 注意：這是 always-on 設定，跑「單一測試檔子集」時覆蓋率會偏低而觸發 fail-under；
# 本機只想跑子集時請加 `--no-cov`（例：`pytest tests/test_foo.py --no-cov`）。
# CI 一律跑全倉，不受此影響。
addopts = "--cov=trustforge --cov-report=term-missing --cov-fail-under=75"

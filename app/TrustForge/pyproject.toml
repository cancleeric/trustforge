[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TrustForge"
version = "0.1.0"
description = "TrustForge AgentCore Runtime — 加密市場信任提煉 AI Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.15.0",
    "boto3 >= 1.34",
    "certifi >= 2024.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

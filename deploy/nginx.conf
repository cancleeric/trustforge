# TrustForge — nginx 反代設定（**cutover 後**目標拓樸，task #28 Phase 3）。
#
# ⛔ 這是 cutover 之後才生效的設定，需 CEO+CISO+CPO 三審 + 老闆簽核才能真的
# 切上去（見 docs/architecture/PLAN-frontend-backend-split.md P3）。cutover 前預設仍用
# `deploy/nginx-legacy.conf`（SSR 全轉發），部署腳本啟用哪一份見
# `deploy/cutover_switch.sh`。
#
# 拓樸：
#   /              → 直接 serve React 靜態 build（frontend/dist），
#                    SPA client-side routing 一律 fallback 回 index.html。
#   /api/*         → proxy 到內部 python（127.0.0.1:8080），python 只監聽
#                    127.0.0.1（見 src/trustforge/web.py::main()），不對外，
#                    避免有心人繞過 nginx 直接對 python 打偽造的
#                    X-Real-IP/X-Forwarded-For header 繞過限流。
#   /healthz       → 同上，proxy 給 python（部署腳本健康檢查用）。
#
# 安全 headers（harper CISO 指令集，PLAN §4 + task #28）：新 CSP 只給這份
# React 拓樸用；python 端 `_send()` 需同步把 `TRUSTFORGE_CSP_MODE=react`
# 設好（見 web.py 模組頂部 CSP_MODE 說明），兩邊「同進退」——nginx 這裡負責
# React 靜態 HTML 文件本身（index.html 不經過 python，CSP 必須由 nginx 下），
# python 那邊負責 /api/* JSON 回應與（若還殘留的話）任何直接由 python 產生
# 的頁面。
#
# TLS：domain 為 trustforge.hurricanesoft.com.tw（DNS A record 已指向
# EC2 <EC2_PUBLIC_IP>），憑證由 certbot 簽發於
# /etc/letsencrypt/live/trustforge.hurricanesoft.com.tw/（見
# deploy/TLS-SETUP.md、deploy/setup_tls.sh：certbot 前 nginx 必須先在 80
# 用 legacy/react-http conf 服務 HTTP-01 challenge，簽發完成後才 cutover
# 到這份 TLS 版）。簽發前這份 conf 的 443 server block 會讓 `nginx -t`
# 失敗（找不到憑證檔），屬預期——bare-IP/無憑證現況請先用
# `deploy/nginx-react-http.conf`（見 deploy/cutover_switch.sh react-http）。

# ── 80 → 443 導向（TLS 就緒後啟用；HTTP 全導向 HTTPS，僅留 /healthz 明碼供
#      LB/健康檢查探測，避免探測器不支援 redirect 時誤判服務掛掉）───────────
#
# ⛔ redirect target 故意用 literal domain、不用 `$host`（codex 複審
# HIGH）：`$host` 會直接反映請求時實際打的 Host（不管是不是偽造/是不是
# canonical domain）——健康檢查/探測器多半直接打 IP（Host: 127.0.0.1 或
# 乾脆沒帶 Host），此時 `$host` = 127.0.0.1，會導去
# `https://127.0.0.1/...`（非 canonical domain，也會讓 TLS handshake 拿到
# 跟 SNI/證書 CN 對不上的奇怪狀況）。改用寫死的
# `trustforge.hurricanesoft.com.tw` 才能保證不管客戶端打什麼 Host/IP 進
# 來，一律導去唯一的 canonical https URL。
upstream trustforge_backend {
    server 127.0.0.1:8080 max_fails=1 fail_timeout=1s;
    server 127.0.0.1:8081 backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name trustforge.hurricanesoft.com.tw;

    location = /healthz {
        proxy_pass http://trustforge_backend/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Let's Encrypt HTTP-01 challenge（**續簽**用，codex 複審 HIGH）：
    # `certbot-renew.timer` 之後定期跑 `certbot renew` 時，live 的已經是
    # 這份 TLS 版 conf（不是 nginx-legacy.conf/nginx-react-http.conf 初次
    # 簽發時的版本），challenge 一樣走 HTTP-01，若沒有這個例外，會被下面
    # `location /` 的 301 全部導去 https，ACME 伺服器打不到明碼 challenge
    # 檔案，續簽會失敗。用 `^~` 確保優先於 301 catch-all。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://trustforge.hurricanesoft.com.tw$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trustforge.hurricanesoft.com.tw;

    # certbot 簽發後的路徑（見 deploy/TLS-SETUP.md、deploy/setup_tls.sh）；
    # 簽發前這兩行會讓 `nginx -t` 失敗（找不到憑證檔），屬預期——這份 conf
    # 是 cutover-ready 設計稿，真正啟用前需先跑完 certbot 再讓這個 server
    # block 生效（順序：deploy legacy/react-http(HTTP) → certbot 簽發 →
    # cutover 到這份 react(TLS)，見 deploy/README.md runbook）。
    ssl_certificate     /etc/letsencrypt/live/trustforge.hurricanesoft.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trustforge.hurricanesoft.com.tw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS（harper 建議）：一年 + includeSubDomains；上線前先確認 443 穩定
    # 一段時間再考慮加 preload（preload 一旦生效很難撤銷，故先不預設開）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # codex 複審 HIGH（dist swap 原子化）：改指到 frontend/current，這是
    # deploy_frontend_nginx.sh 用 `ln -sfn` atomic 切換的 symlink，永遠
    # 指向已驗證過的某個 frontend/releases/<ts>/，不是直接寫死的固定路
    # 徑（換版不再需要 rm -rf 現正 serving 的目錄）。
    root /opt/trustforge/frontend/current;
    index index.html;

    # 前端靜態資源：Vite build 出的檔名帶 content hash，可長快取；index.html
    # 本身不可快取（否則部署新版後使用者可能吃到舊 index 導致 hash 對不上）。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # codex 複審 HIGH：nginx 的 add_header 繼承是「全有全無」——這個
        # location 只要自己宣告了一個 add_header（就算只是 Cache-Control），
        # 就會整個蓋掉從 server 層繼承來的 add_header，包括上面第 89 行的
        # HSTS，導致這條路徑完全不送 HSTS。每個自己宣告 add_header 的
        # location 都要重複補一份 HSTS，才能保證所有回應都有 HSTS。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ⚠️ 這裡務必跟 `location /` 的 add_header 完全同步（見下方註解）：
    # nginx 的 `try_files ... /index.html` fallback 是「內部重導向」，會
    # 拿重導向後的 URI（`/index.html`）重新跑一次 location 比對，而
    # `location = /index.html`（精確比對）比 `location /`（前綴比對）
    # 優先權更高——換句話說，`/`、`/analyze` 等 SPA 路由 fallback 回
    # index.html 時，實際下 header 的是「這個」block，不是 `location /`
    # 那個 block（親測過：只在 `location /` 下 header，用 curl 打
    # `/`、`/analyze`、`/index.html` 三者都量不到 CSP/X-Frame-Options
    # 等 header，只有這裡的 Cache-Control 生效）。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        # codex 複審 HIGH：這個 location 自己宣告了 add_header（CSP 等），
        # 會整個蓋掉 server 層繼承來的 HSTS（第 89 行）——而這裡正是 SPA
        # fallback（`/`、`/analyze` 等）實際下 header 的 block（見上方大段
        # 註解），HSTS 在主要路徑完全失效，必須在這裡重複補一份。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # API：proxy 給只對內監聽的 python。$remote_addr 是 nginx 對端的真實來源
    # IP（TCP 層，非 header，不可偽造）——寫死用這個值當 X-Real-IP，python
    # 端 `TRUSTFORGE_TRUST_PROXY=1` 時才會讀取這個 header 取代直連 IP。
    location /api/ {
        proxy_pass http://trustforge_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 管理面 API（/api/admin/*）硬化（harper CISO 條件 A + M1，管理控制台
    # PR-5）：prefix 比 /api/ 長 → nginx 最長前綴優先，admin 請求一律進這個
    # block，不會落回上面泛用 /api/。
    #   - X-Real-IP **無條件用 TCP 層 $remote_addr 覆寫**（非透傳）：admin
    #     per-IP lockout（web.py `_resolve_client_ip()` 優先讀 X-Real-IP）
    #     的完整性依賴此——若透傳客戶端自帶的 header，攻擊者可偽造來源 IP
    #     分散 lockout 計數（harper M1）。X-Forwarded-For 同步覆寫：
    #     `_resolve_client_ip()` 在 X-Real-IP 缺席時會退回讀 XFF 第一段，
    #     不能留任何一條可被客戶端塞值的路。
    #   - 設定快照（GET /api/admin/config 等）不可被任何中介/瀏覽器快取：
    #     proxy_no_cache + proxy_cache_bypass 防 nginx 端（目前未配置
    #     proxy_cache，屬防禦性設定，日後有人加 cache zone 也咬不到 admin），
    #     Cache-Control: no-store 防下游。
    location /api/admin/ {
        proxy_pass http://trustforge_backend/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        # codex 複審 HIGH（add_header 繼承全有全無）：本 location 自己宣告了
        # add_header（Cache-Control），會整個蓋掉 server 層繼承的 HSTS，必須
        # 在這裡重複補一份（跟 /assets/、= /index.html、/ 同一個坑）。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # （選配，harper 建議）管理面來源 IP allowlist：預設註解（不硬編
        # IP）。啟用方式：取消下面兩行註解、把 <ADMIN_SOURCE_IP> 換成老闆
        # 固定出口 IP（可多行 allow），reload nginx——非名單來源直接 403，
        # 連 token 驗證都碰不到（縱深：token 洩漏也進不來）。啟用步驟見
        # deploy/README.md「管理控制台部署銜接」一節。
        # allow <ADMIN_SOURCE_IP>;
        # deny all;
    }

    location = /healthz {
        proxy_pass http://trustforge_backend/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA client-side routing：非 /api/、非靜態檔的路徑一律 fallback 回
    # index.html，交給 React Router 處理（見 frontend/src 路由設定）。
    # 這裡的 add_header 只作用在本 location（nginx inheritance 是父→子，
    # 不會外溢到上面 /api/、/healthz 這兩個 proxy location），避免跟 python
    # 端 `_send()`（CSP_MODE=react 時）重複下同名 header。
    #
    # ⚠️ 這裡的 add_header **不會**是 `/`、`/analyze` 等 SPA 路由實際拿到
    # 的 header：`try_files ... /index.html` fallback 時 nginx 內部重導向
    # 到 `/index.html`，之後是 `location = /index.html`（精確比對）接手
    # 出 response，不是這個 block（親測驗證過，見 deploy/test_nginx_react_conf.sh）。
    # 這裡仍保留同一份 add_header 是防禦性寫法，只在極少數「$uri 直接命中
    # 根目錄下某個真實檔案」（例如 Vite build 出的 favicon.ico、robots.txt，
    # 不經過內部重導向）時才會真的生效；SPA 路由/index.html 本身的 header
    # 主要生效點是下面 `location = /index.html`，兩邊務必保持同步。
    location / {
        try_files $uri $uri/ /index.html;
        # harper CISO 指令集（PLAN §4 + task #28 安全複審），給 React 靜態
        # HTML 文件用——python 端 `web.py::_send()` 在 `TRUSTFORGE_CSP_MODE=
        # react` 時下的是同一份字串，兩邊需保持同步（cutover 時一起換）。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        # codex 複審 HIGH：跟 /assets/、= /index.html 同理——這個 location
        # 自己宣告了 add_header，會蓋掉 server 層繼承的 HSTS，即使實務上
        # SPA fallback 主要生效點是上面的 `= /index.html`，這裡在極少數
        # 「$uri 直接命中根目錄真實檔案」（如 favicon.ico）的情境下仍要有
        # 一致的 HSTS，兩邊務必保持同步。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

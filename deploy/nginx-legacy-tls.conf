# TrustForge — nginx 反代設定（legacy **TLS** 版：react→legacy 緊急回滾
# 專用，task #28 Phase 3，codex 複審 HIGH：HSTS-safe rollback）。
#
# ⛔ 為什麼需要這一份（不能只回滾到 deploy/nginx-legacy.conf）：
# deploy/nginx.conf（react TLS 版）對外送
# `Strict-Transport-Security: max-age=31536000; includeSubDomains`（一年）
# ——瀏覽器收到這個 header 後，該 domain 之後一年內「所有」對這個 domain
# 的請求（不管使用者手動打 http:// 還是點舊書籤/連結）都會被瀏覽器自己在
# 本地端強制升級成 https，連 TCP SYN 都不會送到 80 port，nginx 端完全看
# 不到、也擋不掉這個行為（這是 HSTS 的設計本意：防降級攻擊）。
# `deploy/nginx-legacy.conf` 只監聽 80（HTTP-only，pre-cert bootstrap
# 用）——若 react→legacy 緊急回滾切上這份，回訪過（吃過 HSTS）的使用者
# 瀏覽器會直接對著 443 發起 TLS handshake，連不上任何東西（這份完全沒有
# 443 server block）。事故發生時想緊急回滾卻讓使用者連不上，回滾本身就
# 失去意義、甚至讓事故惡化。
#
# 修法（codex 複審 HIGH）：react→legacy 回滾時，若偵測到 certbot 憑證
# 已存在（`/etc/letsencrypt/live/<domain>/fullchain.pem`），改用**這份**
# TLS 版 legacy conf（443 serve SSR proxy，仍保留 HSTS），而不是純 HTTP
# 版的 `nginx-legacy.conf`；只有從沒簽過憑證的 pre-cert 現況（ACME
# bootstrap、TLS 還沒就緒）才會用 HTTP-only 版——偵測邏輯見
# deploy/cutover_switch.sh。
#
# 拓樸：跟 deploy/nginx-legacy.conf 完全一樣——SSR + JSON API 全部原樣
# 轉發給 python（`_send()` 端 CSP_MODE=legacy 自己下 CSP，這裡 nginx 不
# 重複下），差別只在多了 443/TLS + HSTS + 80→443 canonical redirect（跟
# deploy/nginx.conf 的 80 server block 設計一致），憑證路徑跟
# deploy/nginx.conf 共用同一張（同一個 domain，回滾不需要另外簽）。

# ── 80 → 443 導向：跟 deploy/nginx.conf 同一套設計（literal canonical
#      domain，不用 $host，見該檔同名註解）；/healthz 明碼供 LB/健康檢查、
#      ACME challenge 明碼供續簽用 ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name trustforge.hurricanesoft.com.tw;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Let's Encrypt HTTP-01 challenge（續簽用）：回滾後 live 的可能是這份
    # conf，續簽一樣得走 HTTP-01，若沒有這個例外會被下面 301 全部導去
    # https，續簽失敗——跟 deploy/nginx.conf 同名 location 道理一致。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://trustforge.hurricanesoft.com.tw$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trustforge.hurricanesoft.com.tw;

    # 憑證路徑跟 deploy/nginx.conf 完全一樣（同一個 domain 共用同一張，
    # 回滾不需要、也不應該重新簽發）。
    ssl_certificate     /etc/letsencrypt/live/trustforge.hurricanesoft.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trustforge.hurricanesoft.com.tw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS：保留跟 deploy/nginx.conf 一致的設定——回滾不代表要打破瀏覽器
    # 端已經記住的 HSTS 承諾；這份本身也是 443/HTTPS 服務，繼續送沒問題
    # （若拿掉，等於回滾又製造了下一次「HSTS 記住的是這份沒送」的新問題）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SSR + JSON API 全部轉發給 python（跟 deploy/nginx-legacy.conf 一模
    # 一樣，只是外層多包一層 TLS）。$remote_addr 是 nginx 對端的真實來源
    # IP（TCP 層，非 header，不可偽造）——寫死用這個值當 X-Real-IP，python
    # 端 `TRUSTFORGE_TRUST_PROXY=1` 時才會讀取這個 header 取代直連 IP。
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

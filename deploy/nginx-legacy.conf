# TrustForge — nginx 反代設定（**cutover 前**預設拓樸，task #28 Phase 3）。
#
# 這是「先把 nginx 層架上去、但功能上跟現況（無 nginx，python 直接對外聽
# :80）逐字等價」的過渡設定——唯一差異是多一層 nginx（單一對外入口，
# TLS 就緒後 certbot 會自動改寫本檔加上 443/redirect，見下方「TLS」段落），
# SSR/API 全部原樣轉發給 python，SSR 頁面繼續正常服務，供 P3「一週觀察期」
# 或緊急回滾用（見 docs/architecture/PLAN-frontend-backend-split.md P3、
# deploy/cutover_switch.sh）。
#
# python 端搭配設定（見 deploy/deploy_frontend_nginx.sh）：
#   TRUSTFORGE_BIND_HOST=127.0.0.1   PORT=8080
#   TRUSTFORGE_TRUST_PROXY=1         TRUSTFORGE_CSP_MODE=legacy（預設值，
#                                     不用特別設也是這個）
#
# ⚠️ 刻意先只寫 HTTP（80），不預先手刻 443 server block：TLS 憑證要先有
# 真實 domain + certbot 簽發（見 deploy/TLS-SETUP.md）才存在，部署當下若
# 這裡就寫死不存在的憑證路徑，`nginx -t`／`nginx -s reload` 會直接失敗、
# 服務起不來。**簽發流程**（`certbot certonly --webroot`，見下方 server
# block 裡的 `/.well-known/acme-challenge/` location）**不會改寫本檔**——
# 跟舊版設計（`certbot --nginx` 自動改寫 server block）不同，這裡刻意分開：
# 本檔本身完全不變，憑證簽出來後由 `deploy/nginx.conf`（cutover 時才切上
# 去的 TLS 版）去讀，見 deploy/setup_tls.sh、deploy/TLS-SETUP.md。
#
# 要切到 React 前端拓樸（cutover）→ 換成 deploy/nginx.conf（已內建 443/TLS
# 區塊，換之前務必核對其 `ssl_certificate` 路徑與 domain 跟 certbot 實際
# 簽出來、寫入本檔案的路徑/domain 一致），見 deploy/cutover_switch.sh。
# 要回滾 → deploy/cutover_switch.sh legacy 換回這份，無需碰 AWS/重建實例。

upstream trustforge_backend {
    server 127.0.0.1:8080 max_fails=1 fail_timeout=1s;
    server 127.0.0.1:8081 backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge（codex 複審 HIGH：`certbot --nginx`
    # non-interactive 需要精準比對到 `server_name <domain>` 的 server
    # block，但這裡刻意保持 `server_name _`（bare IP 現況/未來多 domain
    # 都適用，不寫死），配不到會簽發失敗——改用
    # `certbot certonly --webroot -w /var/www/certbot`，完全不碰 nginx
    # config，challenge 檔案由下面這個 location 直接從檔案系統回應，跟
    # `server_name` 是不是真實 domain 完全無關（同一個 port 上只有一個
    # server block 時，nginx 一律用它服務任何 Host）。用 `^~` 確保不會被
    # 下面的 `location /`（proxy_pass 給 python）吃掉。見
    # deploy/setup_tls.sh、deploy/TLS-SETUP.md。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # SSR + JSON API 全部轉發給 python（含 `/`、`/analyze`、`/status`、
    # `/costs`、`/analyze.json`、`/api/*`、`/healthz`）——python 端
    # `_send()` 目前預設 CSP_MODE=legacy，跟 cutover 前逐字相同的 CSP 由
    # python 自己下，這裡 nginx 不重複下 CSP，避免兩邊不一致。
    #
    # $remote_addr 是 nginx 對端的真實來源 IP（TCP 層，非 header，不可
    # 偽造）——寫死用這個值當 X-Real-IP，python 端
    # `TRUSTFORGE_TRUST_PROXY=1` 時才會讀取這個 header 取代直連 IP
    # （見 src/trustforge/web.py::_resolve_client_ip）。
    location / {
        proxy_pass http://trustforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

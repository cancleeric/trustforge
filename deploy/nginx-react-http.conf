# TrustForge — nginx 反代設定（**cutover 後**目標拓樸，HTTP-only 版，task #28
# Phase 3 前置）。
#
# ⛔ 跟 deploy/nginx.conf（React + TLS）同屬「cutover 之後才生效」的設定，需
# CEO+CISO+CPO 三審 + 老闆簽核才能真的切上去（見
# docs/architecture/PLAN-frontend-backend-split.md P3）。cutover 前預設仍用
# `deploy/nginx-legacy.conf`（SSR 全轉發）；部署腳本啟用哪一份見
# `deploy/cutover_switch.sh`（本檔案對應 `react-http` mode）。
#
# 為什麼需要這一份（跟 deploy/nginx.conf 的差異）：現況 prod 是 bare IP
# （無 domain），Let's Encrypt/certbot 不會對 bare IP 簽發憑證——`deploy/
# nginx.conf` 假設 443/TLS + 80→443 redirect 已就緒，若在無 domain 現況下
# cutover 用那份會直接讓 `nginx -t` 找不到憑證檔案而失敗、或者部署出一個
# 只認 domain 卻沒人連得到的站台。這份 `nginx-react-http.conf` 是同一套
# React 拓樸，但**只有 port 80、無 TLS、無 301 redirect、無 HSTS**（HSTS
# 只在 HTTPS 下有意義，HTTP-only 站台加了也不會生效，故不加）——bare-IP
# 現況先用這份，等真的有 domain + 憑證就緒後，再用 deploy/cutover_switch.sh
# react（TLS 版）換過去（見 deploy/README.md 的「什麼時候用哪份」說明）。
#
# 拓樸（跟 deploy/nginx.conf 完全一致，只差沒有 TLS/redirect/HSTS）：
#   /              → 直接 serve React 靜態 build（frontend/dist），
#                    SPA client-side routing 一律 fallback 回 index.html。
#   /api/*         → proxy 到內部 python（127.0.0.1:8080），python 只監聽
#                    127.0.0.1（見 src/trustforge/web.py::main()），不對外，
#                    避免有心人繞過 nginx 直接對 python 打偽造的
#                    X-Real-IP/X-Forwarded-For header 繞過限流。
#   /healthz       → 同上，proxy 給 python（部署腳本健康檢查用）。
#
# 安全 headers（harper CISO 指令集，PLAN §4 + task #28）：跟 TLS 版同一份
# React CSP 指令集；python 端 `_send()` 需同步把 `TRUSTFORGE_CSP_MODE=react`
# 設好（見 web.py 模組頂部 CSP_MODE 說明），兩邊「同進退」——nginx 這裡負責
# React 靜態 HTML 文件本身（index.html 不經過 python，CSP 必須由 nginx 下），
# python 那邊負責 /api/* JSON 回應與（若還殘留的話）任何直接由 python 產生
# 的頁面。**不加 Strict-Transport-Security**：HSTS 是叫瀏覽器「以後這個
# host 一律只用 HTTPS 連」，站台本身連 HTTPS 都沒有的話加這個 header 只會
# 讓使用者連不上（甚至可能被瀏覽器快取住這個指示、之後真的上了 TLS 才生效，
# 屬預期行為但目前階段不適用），故 HTTP-only 版本刻意不下這個 header。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge（codex 複審 HIGH，理由同
    # deploy/nginx-legacy.conf：改用 `certbot certonly --webroot`，不用
    # `--nginx` plugin，避免 non-interactive 對 `server_name _` 配對不到
    # 而簽發失敗）。`^~` 確保優先於下面 `location /`。見
    # deploy/setup_tls.sh、deploy/TLS-SETUP.md。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # codex 複審 HIGH（dist swap 原子化）：改指到 frontend/current，這是
    # deploy_frontend_nginx.sh 用 `ln -sfn` atomic 切換的 symlink，永遠
    # 指向已驗證過的某個 frontend/releases/<ts>/，不是直接寫死的固定路
    # 徑（換版不再需要 rm -rf 現正 serving 的目錄）。
    root /opt/trustforge/frontend/current;
    index index.html;

    # 前端靜態資源：Vite build 出的檔名帶 content hash，可長快取；index.html
    # 本身不可快取（否則部署新版後使用者可能吃到舊 index 導致 hash 對不上）。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ⚠️ 這裡務必跟 `location /` 的 add_header 完全同步（見下方註解）：
    # nginx 的 `try_files ... /index.html` fallback 是「內部重導向」，會
    # 拿重導向後的 URI（`/index.html`）重新跑一次 location 比對，而
    # `location = /index.html`（精確比對）比 `location /`（前綴比對）
    # 優先權更高——換句話說，`/`、`/analyze` 等 SPA 路由 fallback 回
    # index.html 時，實際下 header 的是「這個」block，不是 `location /`
    # 那個 block（跟 deploy/nginx.conf 同一個坑，親測過：只在 `location /`
    # 下 header，用 curl 打 `/`、`/analyze`、`/index.html` 三者都量不到
    # CSP/X-Frame-Options 等 header，只有這裡的 Cache-Control 生效——見
    # deploy/test_nginx_react_http_conf.sh）。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API：proxy 給只對內監聽的 python。$remote_addr 是 nginx 對端的真實來源
    # IP（TCP 層，非 header，不可偽造）——寫死用這個值當 X-Real-IP，python
    # 端 `TRUSTFORGE_TRUST_PROXY=1` 時才會讀取這個 header 取代直連 IP。
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA client-side routing：非 /api/、非靜態檔的路徑一律 fallback 回
    # index.html，交給 React Router 處理（見 frontend/src 路由設定）。
    # 這裡的 add_header 只作用在本 location（nginx inheritance 是父→子，
    # 不會外溢到上面 /api/、/healthz 這兩個 proxy location），避免跟 python
    # 端 `_send()`（CSP_MODE=react 時）重複下同名 header。
    #
    # ⚠️ 這裡的 add_header **不會**是 `/`、`/analyze` 等 SPA 路由實際拿到
    # 的 header：`try_files ... /index.html` fallback 時 nginx 內部重導向
    # 到 `/index.html`，之後是 `location = /index.html`（精確比對）接手
    # 出 response，不是這個 block（親測驗證過，見
    # deploy/test_nginx_react_http_conf.sh）。這裡仍保留同一份 add_header
    # 是防禦性寫法，只在極少數「$uri 直接命中根目錄下某個真實檔案」（例如
    # Vite build 出的 favicon.ico、robots.txt，不經過內部重導向）時才會真
    # 的生效；SPA 路由/index.html 本身的 header 主要生效點是上面
    # `location = /index.html`，兩邊務必保持同步。
    location / {
        try_files $uri $uri/ /index.html;
        # harper CISO 指令集（PLAN §4 + task #28 安全複審），給 React 靜態
        # HTML 文件用——python 端 `web.py::_send()` 在 `TRUSTFORGE_CSP_MODE=
        # react` 時下的是同一份字串，兩邊需保持同步（cutover 時一起換）。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

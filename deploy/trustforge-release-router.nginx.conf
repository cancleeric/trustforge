# Included inside the TLS server block after the site's authentication layer.
# $remote_user MUST be set by that layer; direct unauthenticated traffic is denied.
location ~ ^/(healthz|api/) {
    if ($remote_user = "") { return 401; }

    proxy_pass http://unix:/run/trustforge/release-router.sock:;
    proxy_http_version 1.1;
    proxy_redirect off;

    # Never trust either identity header supplied by the external client.
    proxy_set_header X-TrustForge-Stable-Subject "";
    proxy_set_header X-TrustForge-Trusted-Subject $remote_user;
    proxy_set_header Host "";
    proxy_set_header Connection "";

    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    proxy_send_timeout 5s;
    client_max_body_size 0;
    limit_except GET { deny all; }
}

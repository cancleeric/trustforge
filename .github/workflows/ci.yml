name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Offline smoke test (4 deliverables)
        run: |
          python -m trustforge.cli analyze \
            --coin BTC --type multi_source \
            --query "CI smoke：BTC 近況" --offline --out out/ci --quiet
          test -f out/ci/report.md
          test -f out/ci/evidence.json
          test -f out/ci/execution_log.jsonl
          echo "✓ 4 交付件產出正常"

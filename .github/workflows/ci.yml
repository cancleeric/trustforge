name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Reject untracked production stubs
        run: python scripts/scan_source_stubs.py --out out/ci/stub-scan.json
      - name: Upload stub scan
        uses: actions/upload-artifact@v4
        with:
          name: stub-scan-${{ matrix.python-version }}
          path: out/ci/stub-scan.json
          if-no-files-found: error
      - name: Offline smoke test (4 deliverables)
        run: |
          python -m trustforge.cli analyze \
            --coin BTC --type multi_source \
            --query "CI smoke：BTC 近況" --offline --out out/ci --quiet
          test -f out/ci/report.md
          test -f out/ci/evidence.json
          test -f out/ci/execution_log.jsonl
          echo "✓ 4 交付件產出正常"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test
      - name: Lint
        run: npm run lint

  competition-qa:
    name: Competition QA gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run bounded original question bank
        env:
          # The fixture-only gate must not contact the production admin-config
          # store or reserve Bedrock budget. Online measurement is separate.
          TRUSTFORGE_BEDROCK_DAILY_USD_CAP: "0"
        run: >-
          python scripts/run_question_bank.py --limit 24
          --out out/ci/question-bank-results.json
      - name: Upload QA result
        uses: actions/upload-artifact@v4
        with:
          name: question-bank-results
          path: out/ci/question-bank-results.json
          if-no-files-found: error

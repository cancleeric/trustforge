<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustForge</title>
    <!-- #20 主題切換 FOUC 防護：在 React mount 前、CSS 套用前就先讀
         localStorage 決定 data-theme，避免先閃一下 dark 預設值才變
         light。邏輯需跟 src/lib/theme.ts 的 resolveInitialTheme 保持
         一致（localStorage > prefers-color-scheme > dark）。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tf-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
